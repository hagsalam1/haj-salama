<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#0b2a4a;--mut:#55697d;--line:#d6e2ee;--acc:#0b2a4a;--acc2:#174676;--gold:#c9a24a;--debt:#b4321f;--ok:#1c7a4f;--warnbg:#fff3cd;--warnink:#5c4400;--errbg:#fde8e6;--errink:#7a1d12;--okbg:#dff5e8;--okink:#145a38;--hover:#f3f7fb;--sh:0 1px 3px rgba(11,42,74,.12);padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a21;--card:#16272f;--ink:#e6f0f4;--mut:#93a9b4;--line:#27404b;--acc:#12304f;--acc2:#1d4f7e;--debt:#ff8a76;--ok:#6fd3a0;--warnbg:#3a3112;--warnink:#f3df9a;--errbg:#3b1a16;--errink:#ffb4a6;--okbg:#12362a;--okink:#a8e8c6;--hover:#1c313a;--sh:none}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom:3px solid var(--gold)}
.top-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand img{height:38px;border-radius:8px;background:#fff}
.src{font-size:12px;opacity:.9;font-weight:400;display:block}
.hb{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;font-size:13px;padding:5px 12px;cursor:pointer;min-height:36px}
nav.tabs{max-width:1280px;margin:0 auto;display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{color:var(--ink);flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px}
nav.tabs button[aria-current="true"]{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 0 var(--gold)}
main{max-width:1280px;margin:0 auto;padding:12px 16px 60px}
h2.sec{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:8px 0}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px;border-top:3px solid var(--gold);box-shadow:var(--sh)}
.kpi small{display:block;color:var(--mut);font-size:12.5px}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:800;display:block;line-height:1.3}
.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.panel{background:var(--card);border-radius:12px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.row2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:760px){.row2{grid-template-columns:1fr}}
.mut{color:var(--mut);font-size:13px}.debt{color:var(--debt)}.ok{color:var(--ok)}
.err,.warn,.okb,.info{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.err{background:var(--errbg);color:var(--errink)}.warn{background:var(--warnbg);color:var(--warnink)}.okb{background:var(--okbg);color:var(--okink)}.info{background:var(--hover);border:1px solid var(--line)}
.btn{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:9px 16px;font-weight:700;cursor:pointer;border-bottom:3px solid var(--gold);min-height:40px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.del{color:var(--debt)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:40px}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.flt{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.login{max-width:380px;margin:30px auto;padding:20px}.login label{margin-top:10px;font-weight:600;color:var(--ink)}.login .btn{width:100%;margin-top:14px}
.logo{display:block;width:min(100%,260px);margin:0 auto 14px;border-radius:16px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--hover);z-index:1;text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;color:var(--mut);cursor:pointer;user-select:none}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr[data-c]{cursor:pointer}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line);background:var(--hover);position:sticky;bottom:0}
.tbl .tag{font-size:11px;background:var(--warnbg);color:var(--warnink);padding:1px 7px;border-radius:99px}
.bar{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:6px}
.bar div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.bar i{flex:1;display:block;border-radius:3px 3px 0 0;min-height:1px}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:4px}.lg s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;text-decoration:none}
.badge{font-size:11px;background:var(--warnbg);color:var(--warnink);padding:1px 8px;border-radius:99px}
.big{font-size:30px;font-weight:800;line-height:1.2}
.noprint{}.printonly{display:none}
details.d{margin:6px 0}details.d summary{cursor:pointer;font-weight:700}
.list{max-height:260px;overflow:auto;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
[hidden]{display:none!important}
@media (max-width:640px){main{padding:10px 10px 60px}.kpi b{font-size:19px}.brand span.t{font-size:15px}.tbl{font-size:12.5px}.tbl td,.tbl th{padding:6px 7px}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:11px}
  header.top,nav.tabs,.noprint,.btn,.chips{display:none!important}
  .printonly{display:block!important}
  .panel,.kpi{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
  .tw{max-height:none!important;overflow:visible!important;border:0}
  .tbl th{position:static;background:#eee;color:#000}.tbl tfoot td{position:static;background:#eee}
  .tbl{font-size:10.5px}
  main{max-width:none;padding:0}
  thead{display:table-header-group}tr{break-inside:avoid}
}

/* الأرقام تُعرض يسار-إلى-يمين داخل الواجهة العربية كي تبقى علامة السالب ملاصقة للرقم */
.kpi b,.big{direction:ltr;text-align:right}
.tbl td.n,.tbl th.n{direction:ltr}

<body>
<div id="app"><div class="panel" style="margin:20px">جاري التحميل…</div></div>
<noscript>التطبيق يحتاج تفعيل JavaScript.</noscript>
<script>
/* ===== core.js — المنطق المحاسبي والاستيراد (بلا واجهة، قابل للاختبار) ===== */
const HS=(function(){
"use strict";
const AR="٠١٢٣٤٥٦٧٨٩";
const digits=s=>String(s??"").replace(/[٠-٩]/g,d=>AR.indexOf(d));
/* هوية العميل = الاسم كما ورد، مع توحيد المسافات فقط. لا دمج للحروف المتشابهة */
const nameKey=s=>String(s??"").replace(/[​-‏ ﻿]/g," ").replace(/\s+/g," ").trim();
/* تطبيع تقريبي: للبحث واقتراحات المراجعة فقط، ولا يستخدم أبدًا في الدمج */
const fuzzy=s=>digits(nameKey(s)).replace(/[ً-ٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
const num=v=>{
  if(typeof v==="number")return isFinite(v)?v:NaN;
  if(v==null)return NaN;
  const t=digits(v).replace(/[,\s ٬]/g,"").replace(/٫/g,".");
  return /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t)?Number(t):NaN;
};
const clean=v=>Math.round(v*1e6)/1e6;           /* إزالة ضجيج الفاصلة العائمة في المجاميع فقط */
const sum=(a,f)=>{let s=0;for(const x of a)s+=f(x);return clean(s)};
const pad=n=>String(n).padStart(2,"0");
const mk=(y,m,d)=>{if(m<1||m>12||d<1||d>31)return null;const t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!==m-1)return null;return `${y}-${pad(m)}-${pad(d)}`};
const serialIso=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5);return mk(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())};
const isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const dn=s=>{const [y,m,d]=String(s).split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};

function dateOrder(vals,def){
  let dm=0,md=0,amb=0,ex="";
  for(const v of vals){const t=digits(v),m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(!m)continue;const a=+m[1],b=+m[2];if(a>12&&b<=12)dm++;else if(b>12&&a<=12)md++;else{amb++;if(!ex)ex=t.split(/\s/)[0]}}
  if(dm&&md)return {mode:null,mixed:true};
  if(dm)return {mode:"dmy"};
  if(md)return {mode:"mdy"};
  return amb?{mode:def,ambiguous:true,ex}:{mode:def};
}
function parseDate(v,mode){
  if(v instanceof Date&&!isNaN(v))return mk(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==="number"&&v>20000&&v<80000)return serialIso(v);
  const t=digits(v).trim();let m;
  if(/^\d{5}(\.\d+)?$/.test(t)&&+t>20000&&+t<80000)return serialIso(+t);
  if((m=t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?!\d)/)))return mk(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?!\d)/))){
    const a=+m[1],b=+m[2],y=+m[3];let mo,d;
    if(a>12){d=a;mo=b}else if(b>12){mo=a;d=b}else if(mode==="dmy"){d=a;mo=b}else{mo=a;d=b}
    return mk(y,mo,d);
  }
  return null;
}

/* ---------- قراءة الملفات حسب أسماء الأعمدة الفعلية ---------- */
const SCHEMA={
  debts:{label:"المديونيات",need:{name:["اسم العميل"],bal:["رصيد"]},opt:{ph:["الهاتف"],mb:["الموبايل"]}},
  sales:{label:"المبيعات",need:{no:["رقم الفاتورة","رقم الفاتور"],d:["التاريخ"],name:["اسم العميل"],t:["الاجمالي"],p:["المدفوع"],r:["الباقي","المتبقي"]},opt:{s:["اسم البائع"],x:["ملاحظات"],st:["المخزن"],sf:["الخزنة"]}},
  pays:{label:"الدفعات",need:{name:["اسم العميل"],a:["المبلغ"],d:["التاريخ"]},opt:{x:["ملاحظات"]}}
};
const FOOT_LABEL=/(صافي|خصومات|مبيعات|اجمالي|مجموع|دفعات)/;
const cellStr=v=>v==null?"":String(v);
const isEmptyCell=v=>v==null||(typeof v==="string"&&v.trim()==="");

function headerMap(rows,kind){
  const sc=SCHEMA[kind];let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){if(rows[i].some(c=>fuzzy(c)==="اسم العميل")){hi=i;break}}
  if(hi<0)for(let i=0;i<Math.min(rows.length,40);i++){if(rows[i].some(c=>fuzzy(c).includes("اسم العميل"))){hi=i;break}}
  if(hi<0)return {err:"لم أجد صف العناوين (عمود «اسم العميل») في الملف"};
  const hdr=rows[hi].map(fuzzy),col={},miss=[];
  const find=al=>{
    const a=al.map(fuzzy);let i=hdr.findIndex(h=>h&&a.includes(h));
    if(i<0)i=hdr.findIndex(h=>h&&a.some(x=>h.includes(x)));
    return i;
  };
  for(const [f,al] of Object.entries(sc.need)){const i=find(al);if(i<0)miss.push(al[0]);else col[f]=i}
  for(const [f,al] of Object.entries(sc.opt)){const i=find(al);if(i>=0)col[f]=i}
  if(miss.length)return {err:"أعمدة ناقصة: "+miss.join("، "),seen:rows[hi].filter(c=>!isEmptyCell(c)).map(String)};
  return {hi,col};
}
function scanFileDates(rows,hi){
  const ds=[];
  for(let i=0;i<Math.min(hi,15);i++)for(const c of rows[i]){
    if(isEmptyCell(c))continue;
    const s=digits(c).trim();
    if(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/.test(s)){const d=parseDate(s);if(d)ds.push(d)}
  }
  ds.sort();return ds.length?{from:ds[0],to:ds[ds.length-1]}:null;
}
function footerScan(row){
  const out={};
  for(let j=0;j<row.length;j++){
    const s=fuzzy(cellStr(row[j]).replace(/[:：]/g," "));
    if(!s||!FOOT_LABEL.test(s)||!isNaN(num(row[j])))continue;
    for(let k=j-1;k>=0;k--){const v=num(row[k]);if(!isNaN(v)){out[s.trim()]=v;break}else if(!isEmptyCell(row[k]))break}
  }
  return out;
}

/* rows: مصفوفة صفوف، firstRow: رقم أول صف في الورقة (1 غالبًا) */
function parseSheet(kind,rows,firstRow=1,now=new Date()){
  const out={kind,critical:[],errors:[],warnings:[],notes:[],items:[],skipped:{blank:0,header:0,footer:0,sign:0,other:[]},footer:{},range:null,fileDates:null,stats:null};
  const hm=headerMap(rows,kind);
  if(hm.err){out.critical.push(hm.err+(hm.seen?` (الأعمدة الموجودة: ${hm.seen.join(" | ")})`:""));return out}
  const {hi,col}=hm,R=i=>firstRow+i;
  out.fileDates=scanFileDates(rows,hi);
  let ord={mode:"mdy"};
  if(kind!=="debts"){
    ord=dateOrder(rows.slice(hi+1).map(r=>r[col.d]),"mdy");
    if(ord.mixed){out.critical.push("التواريخ في الملف مختلطة (بعضها يوم/شهر وبعضها شهر/يوم). صدّر الملف مرة أخرى بتنسيق تاريخ واحد");return out}
    out.dateMode=ord.mode;
    if(ord.ambiguous)out.warnings.push(`كل التواريخ ممكن تفسيرها بطريقتين (مثال: ${ord.ex}). اعتُمد شهر/يوم/سنة. راجع الفترة الظاهرة في الملخص`);
  }
  const tm=new Date(now.getTime()+864e5),maxD=`${tm.getFullYear()}-${pad(tm.getMonth()+1)}-${pad(tm.getDate())}`;
  let total=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(isEmptyCell)){out.skipped.blank++;continue}
    const name=nameKey(r[col.name]),ln=R(i);
    const key=kind==="sales"?col.no:kind==="pays"?col.a:col.bal;
    if(r.some(c=>/www\./i.test(cellStr(c)))){out.skipped.sign++;continue}
    if(r.some(c=>fuzzy(c)==="اسم العميل")){out.skipped.header++;continue}
    const hasKey=!isEmptyCell(r[key]),hasDate=col.d!=null&&!isEmptyCell(r[col.d]);
    if(!name&&!hasKey&&!hasDate){
      const f=footerScan(r);
      if(Object.keys(f).length){out.skipped.footer++;Object.assign(out.footer,f)}
      else out.skipped.other.push({row:ln,why:"صف بلا اسم عميل ولا بيانات مالية: "+r.filter(c=>!isEmptyCell(c)).slice(0,3).join(" | ")});
      continue;
    }
    total++;const bad=m=>out.errors.push({row:ln,msg:m});
    if(!name){bad("اسم العميل فارغ");continue}
    if(kind==="debts"){
      const bal=num(r[col.bal]);
      if(isNaN(bal)){bad(`الرصيد غير صالح: «${cellStr(r[col.bal])}»`);continue}
      out.items.push({row:ln,n:name,ph:nameKey(r[col.ph]),mb:nameKey(r[col.mb]),bal});
    }else if(kind==="sales"){
      const no=nameKey(r[col.no]);if(!no){bad("رقم الفاتورة فارغ");continue}
      const d=parseDate(r[col.d],ord.mode),t=num(r[col.t]),p=num(r[col.p]),rm=num(r[col.r]);
      const why=[];
      if(!d)why.push(`تاريخ غير صالح «${cellStr(r[col.d])}»`);else if(d>maxD)why.push(`تاريخ مستقبلي ${d}`);else if(d<"2015-01-01")why.push(`تاريخ قديم جدًا ${d}`);
      if(isNaN(t))why.push(`الإجمالي غير صالح «${cellStr(r[col.t])}»`);
      if(isNaN(p))why.push(`المدفوع غير صالح «${cellStr(r[col.p])}»`);
      if(isNaN(rm))why.push(`المتبقي غير صالح «${cellStr(r[col.r])}»`);
      if(why.length){bad(`الفاتورة ${no}: ${why.join("، ")}`);continue}
      out.items.push({row:ln,no,d,n:name,t,p,r:rm,s:nameKey(r[col.s]),x:nameKey(r[col.x]),st:nameKey(r[col.st]),sf:nameKey(r[col.sf])});
    }else{
      const d=parseDate(r[col.d],ord.mode),a=num(r[col.a]),why=[];
      if(!d)why.push(`تاريخ غير صالح «${cellStr(r[col.d])}»`);else if(d>maxD)why.push(`تاريخ مستقبلي ${d}`);else if(d<"2015-01-01")why.push(`تاريخ قديم جدًا ${d}`);
      if(isNaN(a))why.push(`المبلغ غير صالح «${cellStr(r[col.a])}»`);
      if(why.length){bad("دفعة: "+why.join("، "));continue}
      out.items.push({row:ln,d,n:name,a,x:nameKey(r[col.x])});
    }
  }
  if(!out.items.length)out.critical.push(total?"كل صفوف الملف غير صالحة":"الملف لا يحتوي على بيانات (فارغ)");
  if(total&&out.errors.length>Math.max(3,Math.floor(total*0.1)))out.critical.push(`عدد الصفوف التالفة كبير (${out.errors.length} من ${total}). غالبًا الملف غير صحيح`);
  /* مجاميع وفحوص داخلية */
  const I=out.items,st={rows:total,ok:I.length,bad:out.errors.length};
  if(kind==="debts"){
    st.pos=sum(I.filter(x=>x.bal>0),x=>x.bal);st.neg=sum(I.filter(x=>x.bal<0),x=>x.bal);st.net=clean(st.pos+st.neg);
    st.nPos=I.filter(x=>x.bal>0).length;st.nNeg=I.filter(x=>x.bal<0).length;st.nZero=I.filter(x=>x.bal===0).length;
    const g=new Map();I.forEach(x=>{const k=nameKey(x.n);(g.get(k)||g.set(k,[]).get(k)).push(x.row)});
    const d=[...g].filter(([,v])=>v.length>1);
    st.dupNames=d.length;if(d.length)out.warnings.push(`${d.length} اسم مكرر في المديونيات (كل الصفوف محفوظة، والحركات تُنسب لأول صف): ${d.slice(0,4).map(([k,v])=>`${k} (صفوف ${v.join("،")})`).join("؛ ")}`);
  }else if(kind==="sales"){
    st.total=sum(I,x=>x.t);st.paid=sum(I,x=>x.p);st.rem=sum(I,x=>x.r);
    st.eqBad=I.filter(x=>Math.abs(x.t-x.p-x.r)>0.005).length;
    const no=new Map(),fp=new Map();
    I.forEach(x=>{no.set(x.no,(no.get(x.no)||0)+1);const k=[x.no,x.d,x.n,x.t,x.p,x.r].join("|");fp.set(k,(fp.get(k)||0)+1)});
    st.dupNo=[...no.values()].filter(v=>v>1).length;st.dupFull=[...fp.values()].reduce((s,v)=>s+(v>1?v-1:0),0);
    if(st.eqBad)out.warnings.push(`${st.eqBad} فاتورة الإجمالي فيها ≠ المدفوع + المتبقي (تظهر في تقرير الفواتير غير السليمة، ولم يُعدَّل شيء)`);
    if(st.dupNo)out.warnings.push(`${st.dupNo} رقم فاتورة مكرر (كل الصفوف محفوظة)`);
    if(st.dupFull)out.warnings.push(`${st.dupFull} فاتورة مكررة بنفس كل البيانات (محفوظة كلها، ولم تُحذف)`);
    const f=out.footer,get=re=>{const k=Object.keys(f).find(k=>re.test(k));return k==null?null:f[k]};
    st.footSales=get(/مبيعات/);st.footDisc=get(/خصومات/);st.footNet=get(/صافي/);
    if(st.footSales!=null){
      const exp=st.total+(st.footDisc||0),tol=Math.max(50,Math.abs(st.footSales)*2e-6);
      st.footOk=Math.abs(exp-st.footSales)<=tol;
      out.notes.push(`ذيل التقرير: مبيعات ${st.footSales} − خصومات ${st.footDisc??0}. مجموع إجمالي الفواتير في الصفوف = ${st.total}. ${st.footOk?"متوافق (الفرق ضمن دقة العرض في ذيل التقرير)":"⚠ غير متوافق"}`);
      if(!st.footOk)out.warnings.push(`مجموع الفواتير (${st.total}) لا يتوافق مع ذيل التقرير (مبيعات ${st.footSales} − خصومات ${st.footDisc??0}). قد يكون الملف ناقصًا`);
    }
    if(st.footNet!=null)out.notes.push(`«صافي» في ذيل التقرير = ${st.footNet}، ولا يمكن تفسيره من الملفات المرفوعة (قد يشمل مرتجعات). للعلم فقط`);
  }else{
    st.total=sum(I,x=>x.a);
    const fp=new Map();I.forEach(x=>{const k=[x.d,x.n,x.a].join("|");fp.set(k,(fp.get(k)||0)+1)});
    st.dupFull=[...fp.values()].reduce((s,v)=>s+(v>1?v-1:0),0);st.nonPos=I.filter(x=>x.a<=0).length;
    if(st.dupFull)out.warnings.push(`${st.dupFull} دفعة متطابقة تمامًا (نفس التاريخ والعميل والمبلغ). محفوظة كلها ولم تُحذف. قد تكون دفعتين حقيقيتين، راجعها`);
    if(st.nonPos)out.warnings.push(`${st.nonPos} دفعة مبلغها صفر أو سالب`);
    const ft=Object.entries(out.footer).find(([k])=>/اجمالي|مجموع/.test(k));
    if(ft){st.footTotal=ft[1];st.footOk=Math.abs(st.total-ft[1])<0.005;
      out.notes.push(`ذيل التقرير: إجمالي الدفعات ${ft[1]} مقابل مجموع الصفوف ${st.total}: ${st.footOk?"متطابق":"⚠ غير متطابق"}`);
      if(!st.footOk)out.warnings.push(`مجموع الدفعات (${st.total}) لا يطابق إجمالي ذيل التقرير (${ft[1]})`);}
  }
  if(kind!=="debts"&&I.length){const ds=I.map(x=>x.d).sort();out.range={min:ds[0],max:ds[ds.length-1]}}
  if(out.errors.length)out.warnings.unshift(`${out.errors.length} صف غير صالح لن يُستورد (قائمة الصفوف ورقم كل صف وسببه في الأسفل)`);
  if(out.skipped.other.length)out.warnings.push(`${out.skipped.other.length} صف بلا بيانات مالية تم تجاوزه (مدرج في التفاصيل)`);
  out.stats=st;return out;
}

/* ---------- فحص الملفات الثلاثة معًا ---------- */
function crossCheck(P){
  const w=[],{debts:D,sales:S,pays:Y}=P;
  const printed=[["المديونيات",D?.fileDates?.to],["المبيعات",S?.fileDates?.to],["الدفعات",Y?.fileDates?.to]].filter(x=>x[1]);
  if(printed.length>1){const ds=printed.map(x=>x[1]).sort();if(dn(ds[ds.length-1])-dn(ds[0])>1)w.push(`تواريخ إصدار الملفات غير متقاربة: ${printed.map(x=>x[0]+" "+x[1]).join("، ")}. تأكد أنها من نفس اليوم`)}
  const fr=[["المبيعات",S?.fileDates?.from],["الدفعات",Y?.fileDates?.from]].filter(x=>x[1]);
  if(fr.length===2&&fr[0][1]!==fr[1][1])w.push(`بداية فترة المبيعات (${fr[0][1]}) تختلف عن بداية فترة الدفعات (${fr[1][1]})`);
  if(S?.range&&Y?.range){
    if(Math.abs(dn(S.range.min)-dn(Y.range.min))>31)w.push(`أول حركة في المبيعات (${S.range.min}) بعيدة عن أول دفعة (${Y.range.min})`);
    if(Math.abs(dn(S.range.max)-dn(Y.range.max))>7)w.push(`آخر حركة في المبيعات (${S.range.max}) بعيدة عن آخر دفعة (${Y.range.max})`);
  }
  return w;
}

/* ---------- النموذج: ربط الحركات بالعملاء (مطابقة حرفية فقط) ---------- */
function buildModel(data,aliases={}){
  const C=data.debts.map((x,i)=>({id:i,row:x.row,n:x.n,key:nameKey(x.n),ph:x.ph||"",mb:x.mb||"",bal:x.bal,inv:[],pay:[],mv:null}));
  const k2id=new Map(),dupKeys=new Set();
  for(const c of C){if(k2id.has(c.key))dupKeys.add(c.key);else k2id.set(c.key,c.id)}
  const al=new Map();
  for(const [a,t] of Object.entries(aliases||{})){const ak=nameKey(a),tk=nameKey(t);if(!k2id.has(ak)&&k2id.has(tk))al.set(ak,k2id.get(tk))}
  const find=n=>{const k=nameKey(n);return k2id.has(k)?k2id.get(k):al.has(k)?al.get(k):-1};
  const inv=data.sales.map((x,i)=>({...x,i,k:nameKey(x.n),cid:find(x.n)}));
  const pay=data.pays.map((x,i)=>({...x,i,k:nameKey(x.n),cid:find(x.n),link:null}));
  /* ربط الدفعة بالمدفوع داخل الفاتورة (استنتاج: نفس العميل والتاريخ والمبلغ) كي لا يُحتسب مرتين */
  const need=new Map();
  for(const v of inv)if(v.p>0){const k=`${v.k}|${v.d}|${v.p}`;(need.get(k)||need.set(k,[]).get(k)).push(v.no)}
  for(const y of pay){const q=need.get(`${y.k}|${y.d}|${y.a}`);if(q&&q.length)y.link=q.shift()}
  const unlinkedPaid=[];for(const q of need.values())if(q.length)unlinkedPaid.push(...q);
  /* غير مطابقين */
  const U=new Map();
  const ug=(k,n)=>U.get(k)||U.set(k,{k,n,inv:[],pay:[]}).get(k);
  for(const v of inv){if(v.cid<0)ug(v.k,v.n).inv.push(v);else C[v.cid].inv.push(v)}
  for(const y of pay){if(y.cid<0)ug(y.k,y.n).pay.push(y);else C[y.cid].pay.push(y)}
  const noNum=a=>parseFloat(a)||0;
  for(const c of C){
    const mv=[];
    c.inv.forEach(v=>mv.push({d:v.d,o:0,no:v.no,dr:v.t,cr:0,ref:v}));
    c.pay.forEach(y=>mv.push({d:y.d,o:1,no:"",dr:0,cr:y.a,ref:y}));
    mv.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.o-b.o||noNum(a.no)-noNum(b.no)||a.ref.row-b.ref.row);
    c.mv=mv;c.sales=sum(c.inv,v=>v.t);c.paidIn=sum(c.inv,v=>v.p);c.coll=sum(c.pay,y=>y.a);
    c.lastInv=c.inv.reduce((m,v)=>v.d>m?v.d:m,"");c.lastPay=c.pay.reduce((m,y)=>y.d>m?y.d:m,"");
    c.implied=clean(c.bal-(c.sales-c.coll));        /* رصيد ما قبل أول حركة محفوظة (مستنتج) */
  }
  const unmatched=[...U.values()].map(u=>({...u,sales:sum(u.inv,v=>v.t),coll:sum(u.pay,y=>y.a),
    first:[...u.inv,...u.pay].reduce((m,x)=>!m||x.d<m?x.d:m,""),last:[...u.inv,...u.pay].reduce((m,x)=>x.d>m?x.d:m,"")})).sort((a,b)=>b.inv.length+b.pay.length-a.inv.length-a.pay.length||a.n.localeCompare(b.n,"ar"));
  return {C,inv,pay,unmatched,dupKeys,k2id,aliasCount:al.size,unlinkedPaid,sellers:[...new Set(inv.map(v=>v.s||"بدون اسم"))].sort((a,b)=>a.localeCompare(b,"ar"))};
}
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a}
function dice(a,b){if(a===b)return 1;const x=bigrams(a),y=bigrams(b);if(!x.length||!y.length)return 0;const m=new Map();y.forEach(g=>m.set(g,(m.get(g)||0)+1));let h=0;x.forEach(g=>{if(m.get(g)>0){h++;m.set(g,m.get(g)-1)}});return 2*h/(x.length+y.length)}
/* اقتراحات فقط، ولا يُنفَّذ أي دمج إلا بتأكيد المستخدم */
function suggest(model,u,max=3){
  const f=fuzzy(u.n),r=[];
  for(const c of model.C){const s=dice(f,fuzzy(c.n));if(s>=0.72)r.push({id:c.id,n:c.n,score:s,exact:fuzzy(c.n)===f})}
  return r.sort((a,b)=>b.score-a.score).slice(0,max);
}

/* ---------- كشف الحساب ---------- */
function statement(c,from,to,mode="full"){
  const mv=c.mv;let after=0;
  for(const m of mv)if(m.d>=from)after+=m.dr-m.cr;
  const open=clean(c.bal-after);let run=open;
  let rows=mv.filter(m=>m.d>=from&&m.d<=to).map(m=>{run=clean(run+m.dr-m.cr);return {d:m.d,o:m.o,no:m.no,dr:m.dr,cr:m.cr,bal:run,ref:m.ref}});
  const dr=sum(rows,m=>m.dr),cr=sum(rows,m=>m.cr);
  if(mode==="short"){
    const g=new Map();rows.forEach(m=>{const e=g.get(m.d)||g.set(m.d,{d:m.d,dr:0,cr:0,bal:0,n:0}).get(m.d);e.dr+=m.dr;e.cr+=m.cr;e.bal=m.bal;e.n++});
    rows=[...g.values()].map(e=>({...e,dr:clean(e.dr),cr:clean(e.cr)}));
  }
  const first=mv.length?mv[0].d:"";
  return {open,rows,close:run,dr,cr,first,beforeFirst:!!(first&&from<first),n:rows.length};
}

/* ---------- المراجعة الإجمالية والتسوية ---------- */
function reconcile(m){
  const S=sum(m.inv,v=>v.t),P=sum(m.pay,y=>y.a),PL=sum(m.pay.filter(y=>y.link!=null),y=>y.a);
  const bals=m.C.map(c=>c.bal),net=sum(bals,b=>b),pos=sum(bals.filter(b=>b>0),b=>b),neg=sum(bals.filter(b=>b<0),b=>b);
  const um=m.unmatched,uS=sum(um,u=>u.sales),uP=sum(um,u=>u.coll);
  const matched=m.C.filter(c=>c.mv.length),impl=sum(m.C,c=>c.implied);
  const diff=clean(net-(S-P));
  return {S,P,PL,PS:clean(P-PL),paidInInv:sum(m.inv,v=>v.p),net,pos,neg,nCust:m.C.length,nPos:bals.filter(b=>b>0).length,nNeg:bals.filter(b=>b<0).length,nZero:bals.filter(b=>b===0).length,
    nUnm:um.length,unmInv:um.reduce((s,u)=>s+u.inv.length,0),unmPay:um.reduce((s,u)=>s+u.pay.length,0),uS,uP,uNet:clean(uS-uP),impl,
    diff,explained:clean(impl-(uS-uP)),residual:clean(diff-(impl-(uS-uP))),noMove:m.C.filter(c=>!c.mv.length).length,matched:matched.length};
}


/* ---------- المتابعة: متأخرو السداد / الأقل نشاطًا / فواتير مشتبه تكرارها (للعرض والمراجعة فقط) ---------- */
function followUp(m,ref,days){
  const D=days>0?days:30,R=dn(ref),late=[],lateNone=[],idle=[],never=[];
  for(const c of m.C){
    if(c.bal>0){
      if(c.lastPay){const g=R-dn(c.lastPay);if(g>=D)late.push({c,days:g,since:c.lastPay})}
      else lateNone.push({c});
    }
    if(c.lastInv){const g=R-dn(c.lastInv);if(g>=D)idle.push({c,days:g,since:c.lastInv})}
    else if(!c.inv.length)never.push({c});
  }
  const byDays=(a,b)=>b.days-a.days||a.c.n.localeCompare(b.c.n,"ar");
  late.sort(byDays);idle.sort(byDays);lateNone.sort((a,b)=>b.c.bal-a.c.bal);never.sort((a,b)=>a.c.n.localeCompare(b.c.n,"ar"));
  return {days:D,ref,late,lateNone,idle,never};
}
/* نفس العميل ونفس التاريخ ونفس الإجمالي لكن برقمي فاتورة مختلفين: اشتباه فقط، ولا يُحذف شيء */
function suspectDups(m){
  const g=new Map();
  for(const v of m.inv){const k=[v.cid>=0?"c"+v.cid:"u"+v.k,v.d,v.t].join("|");(g.get(k)||g.set(k,[]).get(k)).push(v)}
  const out=[];
  for(const a of g.values()){if(a.length<2)continue;if(new Set(a.map(v=>v.no)).size<2)continue;out.push({n:a[0].cid>=0?m.C[a[0].cid].n:a[0].n,cid:a[0].cid,k:a[0].k,d:a[0].d,t:a[0].t,nos:a.map(v=>v.no)})}
  return out.sort((x,y)=>y.d.localeCompare(x.d)||x.n.localeCompare(y.n,"ar"));
}

/* ---------- التقارير ---------- */
const rnd=v=>clean(v);
function filt(m,f={}){
  const from=f.from||"0000-01-01",to=f.to||"9999-12-31",rep=f.rep||"";
  const cm=r=>{
    if(!f.cust)return true;
    if(f.cust.startsWith("c:"))return r.cid===+f.cust.slice(2);
    return r.cid<0&&r.k===f.cust.slice(2);
  };
  const inv=m.inv.filter(v=>v.d>=from&&v.d<=to&&cm(v)&&(!rep||(v.s||"بدون اسم")===rep));
  const pay=rep?[]:m.pay.filter(y=>y.d>=from&&y.d<=to&&cm(y));
  return {inv,pay,from,to,rep};
}
function groupBy(a,kf){const g=new Map();for(const x of a){const k=kf(x);(g.get(k)||g.set(k,[]).get(k)).push(x)}return g}
function periodRows(inv,pay,len){ /* يوم=10 شهر=7 */
  const ks=new Set([...inv.map(v=>v.d.slice(0,len)),...pay.map(y=>y.d.slice(0,len))]);
  const gi=groupBy(inv,v=>v.d.slice(0,len)),gp=groupBy(pay,y=>y.d.slice(0,len));
  return [...ks].sort().map(k=>{const I=gi.get(k)||[],P=gp.get(k)||[];return [k,I.length,sum(I,v=>v.t),sum(I,v=>v.p),sum(I,v=>v.r),P.length,sum(P,y=>y.a)]});
}
const T=(title,head,rows,o={})=>({title,head,rows,num:o.num||[],foot:o.foot||null,links:o.links||null,note:o.note||""});
const totRow=(rows,idx,label="الإجمالي")=>{const r=new Array(rows[0]?.length||idx.length+1).fill("");r[0]=label;idx.forEach(i=>{r[i]=clean(rows.reduce((s,x)=>s+(+x[i]||0),0))});return r};


function collByCust(m,P){
  const g=groupBy(P,y=>y.cid>=0?"c"+y.cid:"u"+y.k),L=[...g.values()].map(a=>({a,nm:a[0].cid>=0?m.C[a[0].cid].n:a[0].n+" (غير مطابق)",t:sum(a,y=>y.a)})).sort((x,y)=>y.t-x.t||x.nm.localeCompare(y.nm,"ar"));
  const rows=L.map(x=>[x.nm,x.a.length,x.t]);
  return T("التحصيل حسب العميل (ملف الدفعات)",["العميل","عدد الحركات","المبلغ"],rows,{num:[1,2],foot:rows.length?totRow(rows,[1,2]):null,links:L.map(x=>x.a[0].cid>=0?x.a[0].cid:"u:"+x.a[0].k)});
}

   return {cards:[["إجمالي الأرصدة الموجبة",tot],["عدد المدينين",m.C.filter(c=>c.bal>0).length,1],["حصة أعلى 10",tot?clean(sum(C.slice(0,10),c=>c.bal)/tot*100):0,2]],tables:[T("أعلى 50 رصيدًا مدينًا",["#","العميل","الرصيد","% من إجمالي الموجب","آخر دفعة","آخر فاتورة"],rows,{num:[2,3],links:C.map(c=>c.id)})],note:""}}},
 {id:"negBal",n:"6. أصحاب الأرصدة السالبة",run(m){
   const C=m.C.filter(c=>c.bal<0).sort((a,b)=>a.bal-b.bal),rows=C.map(c=>[c.n,c.ph||c.mb,c.bal,c.lastPay||"—",c.lastInv||"—"]);
   return {cards:[["عدد العملاء",C.length,1],["إجمالي الأرصدة السالبة",sum(C,c=>c.bal)]],tables:[T("الأرصدة السالبة (دائنة للعميل)",["العميل","الهاتف","الرصيد","آخر دفعة","آخر فاتورة"],rows,{num:[2],links:C.map(c=>c.id)})],note:"الرصيد السالب يعني أن العميل دفع أكثر من مشترياته (أو له مرتجع/تسوية). يُعرض كما هو في حساباتي."}}},
 {id:"zeroBal",n:"7. أصحاب الرصيد الصفري",run(m){
   const C=m.C.filter(c=>c.bal===0),rows=C.map(c=>[c.n,c.ph||c.mb,c.lastPay||"—",c.lastInv||"—"]);
   return {cards:[["عدد العملاء",C.length,1]],tables:[T("الأرصدة الصفرية",["العميل","الهاتف","آخر دفعة","آخر فاتورة"],rows,{links:C.map(c=>c.id)})],note:C.length?"":"لا يوجد في ملف المديونيات الحالي أي عميل برصيد صفري."}}},
 {id:"unmatched",n:"8. عملاء غير مطابقين لكشف المديونيات",run(m,f){
   const q=f.q?fuzzy(f.q):"",U=m.unmatched.filter(u=>!q||fuzzy(u.n).includes(q));
   const rows=U.map(u=>[u.n,u.inv.length,u.pay.length,u.sales,u.coll,clean(u.sales-u.coll),u.first,u.last]);
   return {cards:[["عدد العملاء غير المطابقين",U.length,1],["فواتيرهم",U.reduce((s,u)=>s+u.inv.length,0),1],["دفعاتهم",U.reduce((s,u)=>s+u.pay.length,0),1],["صافي حركتهم (مبيعات − دفعات)",sum(U,u=>u.sales-u.coll)]],
   tables:[T("عملاء ظهروا في المبيعات أو الدفعات ولم يظهروا في المديونيات",["الاسم كما في الملف","فواتير","دفعات","مبيعات","دفعات (مبلغ)","الصافي","أول حركة","آخر حركة"],rows,{num:[1,2,3,4,5],foot:rows.length?totRow(rows,[1,2,3,4,5]):null,links:U.map(u=>"u:"+u.k)})],
   note:"لم يُنشأ لهم رصيد، ولم تُحذف حركاتهم، ولم يُدمج أي اسم تلقائيًا. افتح الاسم لمراجعته وربطه يدويًا بعميل (بعد تأكيدك)."}}},
 {id:"repTop",n:"9. أعلى المندوبين مبيعًا",run(m,f){
   const F=filt(m,f),g=groupBy(F.inv,v=>v.s||"بدون اسم"),rows=[...g].map(([s,a])=>[s,a.length,sum(a,v=>v.t),sum(a,v=>v.p),sum(a,v=>v.r),new Set(a.map(v=>v.k)).size]).sort((a,b)=>b[2]-a[2]);
   return {cards:[["عدد المندوبين",rows.length,1],["إجمالي المبيعات",sum(F.inv,v=>v.t)]],tables:[T("ترتيب المندوبين",["المندوب","الفواتير","المبيعات","المدفوع","المتبقي","عدد العملاء"],rows,{num:[1,2,3,4,5],foot:rows.length?totRow(rows,[1,2,3,4]):null})],note:""}}},
 {id:"items",n:"10. أعلى الأصناف مبيعًا",run(){return {cards:[],tables:[],note:"غير متاح: ملف المبيعات المرفوع يحتوي على فواتير بإجماليها فقط ولا يحتوي على أي بيانات أصناف أو كميات. لم يُنشأ هذا التقرير حتى لا تُعرض أرقام غير موجودة في الملفات.",unavailable:true}}},
 {id:"salesRep",n:"11. المبيعات حسب المندوب",run(m,f){
   const F=filt(m,f),g=groupBy(F.inv,v=>(v.s||"بدون اسم")+"|"+v.d.slice(0,7)),rows=[...g].map(([k,a])=>{const [s,mo]=k.split("|");return [s,mo,a.length,sum(a,v=>v.t),sum(a,v=>v.p),sum(a,v=>v.r)]}).sort((a,b)=>a[0].localeCompare(b[0],"ar")||a[1].localeCompare(b[1]));
   return {cards:[["إجمالي المبيعات",sum(F.inv,v=>v.t)],["الفواتير",F.inv.length,1]],tables:[T("المبيعات لكل مندوب في كل شهر",["المندوب","الشهر","الفواتير","المبيعات","المدفوع","المتبقي"],rows,{num:[2,3,4,5],foot:rows.length?totRow(rows,[2,3,4,5]):null})],note:""}}},
 {id:"unpaid",n:"12. الفواتير غير المسددة بالكامل",run(m,f){
   const F=filt(m,f),I=F.inv.filter(v=>v.r>0.005).sort((a,b)=>b.d.localeCompare(a.d)),rows=I.map(v=>[v.d,v.no,v.n,v.t,v.p,v.r,v.cid<0?"غير مطابق":""]);
   return {cards:[["عدد الفواتير",I.length,1],["إجمالي المتبقي",sum(I,v=>v.r)]],tables:[T("فواتير متبقيها أكبر من صفر",["التاريخ","رقم الفاتورة","العميل","الإجمالي","المدفوع","المتبقي","ملاحظة"],rows,{num:[3,4,5],foot:rows.length?totRow(rows,[3,4,5]):null,links:I.map(v=>v.cid<0?"u:"+v.k:v.cid)})],note:"متبقي الفاتورة وقت إصدارها، وليس رصيد العميل الحالي (قد يكون سُدد لاحقًا عبر دفعة مستقلة)."}}},
 {id:"badInv",n:"13. الفواتير ذات البيانات غير السليمة",run(m,f){
   const F=filt(m,f),cnt=new Map(),fp=new Map();m.inv.forEach(v=>{cnt.set(v.no,(cnt.get(v.no)||0)+1);const k=[v.no,v.d,v.n,v.t,v.p,v.r].join("|");fp.set(k,(fp.get(k)||0)+1)});
   const rows=[];
   for(const v of F.inv){const why=[];
     if(Math.abs(v.t-v.p-v.r)>0.005)why.push(`الإجمالي ≠ المدفوع + المتبقي (فرق ${clean(v.t-v.p-v.r)})`);
     if(cnt.get(v.no)>1)why.push("رقم الفاتورة مكرر");
     if(fp.get([v.no,v.d,v.n,v.t,v.p,v.r].join("|"))>1)why.push("مكررة بنفس كل البيانات");
     if(v.t<=0)why.push("إجمالي صفر أو سالب");
     if(v.p>v.t&&Math.abs(v.t-v.p-v.r)<=0.005)why.push("المدفوع أكبر من الإجمالي (سداد زائد/دفعة على الحساب داخل الفاتورة)");
     if(why.length)rows.push([v.row,v.no,v.d,v.n,v.t,v.p,v.r,why.join("؛ ")]);}
   return {cards:[["فواتير بها ملاحظات",rows.length,1],["اختلاف المعادلة",F.inv.filter(v=>Math.abs(v.t-v.p-v.r)>0.005).length,1]],tables:[T("نتائج المراجعة (لم يتم تعديل أي بيانات أصلية)",["صف الملف","رقم الفاتورة","التاريخ","العميل","الإجمالي","المدفوع","المتبقي","الملاحظة"],rows,{num:[4,5,6]})],note:"السداد الزائد ليس خطأً بالضرورة: قد يكون المدفوع شمل دفعة من حساب العميل القديم."}}},
 {id:"salesVsColl",n:"14. مقارنة المبيعات والتحصيلات",run(m,f){
   const F=filt(m,f),R=periodRows(F.inv,F.pay,7),rows=R.map(r=>[r[0],r[1],r[2],r[5],r[6],clean(r[2]-r[6]),r[2]?clean(r[6]/r[2]*100):0]);
   return {cards:[["المبيعات",sum(F.inv,v=>v.t)],["التحصيلات",sum(F.pay,y=>y.a)],["الفرق",clean(sum(F.inv,v=>v.t)-sum(F.pay,y=>y.a))]],tables:[T("شهريًا",["الشهر","فواتير","المبيعات","حركات التحصيل","التحصيلات","الفرق","التحصيل % من المبيعات"],rows,{num:[1,2,3,4,5,6],foot:rows.length?totRow(rows,[1,2,3,4,5]):null})],note:"الفرق بين المبيعات والتحصيلات ليس بالضرورة مساويًا لتغير المديونية (توجد أرصدة افتتاحية وحركات غير متاحة). انظر شاشة «المراجعة والتسوية»."}}},
 {id:"custMove",n:"15. حركة كل عميل",run(m,f){

/* ---------- جودة البيانات ---------- */
function quality(m,rec){
  const rows=[],add=(g,w,n,d)=>rows.push([g,w,n,d||""]);
  const R=reconcile(m);
  add("مطابقة الأسماء","عملاء في المبيعات/الدفعات غير موجودين في المديونيات",R.nUnm,"انظر تقرير 8");
  add("مطابقة الأسماء","عملاء في المديونيات بلا أي حركة في الفواتير والدفعات",R.noMove,"");
  add("مطابقة الأسماء","أسماء مكررة في المديونيات",m.dupKeys.size,[...m.dupKeys].slice(0,5).join("، "));
  add("مطابقة الأسماء","روابط يدوية مؤكدة مفعّلة",m.aliasCount,"");
  const eq=m.inv.filter(v=>Math.abs(v.t-v.p-v.r)>0.005).length;
  add("الفواتير","الإجمالي ≠ المدفوع + المتبقي",eq,"");
  const cnt=new Map();m.inv.forEach(v=>cnt.set(v.no,(cnt.get(v.no)||0)+1));
  add("الفواتير","أرقام فواتير مكررة",[...cnt.values()].filter(v=>v>1).length,"");
  add("الفواتير","فواتير مدفوعها > 0 بلا دفعة مطابقة في ملف الدفعات",m.unlinkedPaid.length,m.unlinkedPaid.slice(0,6).join("، "));
  const fp=new Map();m.pay.forEach(y=>{const k=[y.d,y.k,y.a].join("|");fp.set(k,(fp.get(k)||0)+1)});
  add("الفواتير","فواتير مشتبه تكرارها (نفس العميل والتاريخ والإجمالي برقمين مختلفين)، للمراجعة فقط",suspectDups(m).length,"انظر شاشة المتابعة");
  add("الدفعات","دفعات متطابقة (نفس التاريخ والعميل والمبلغ) محفوظة كلها",[...fp.values()].reduce((s,v)=>s+(v>1?v-1:0),0),"راجعها: قد تكون حقيقية");
  add("الدفعات","دفعات مبلغها ≤ 0",m.pay.filter(y=>y.a<=0).length,"");
  if(rec){
    for(const [k,l] of [["debts","المديونيات"],["sales","المبيعات"],["pays","الدفعات"]]){
      const f=rec.files?.[k];if(!f)continue;
      add("الاستيراد","صفوف مستبعدة لعدم صلاحيتها — "+l,f.bad||0,f.bad?"التفاصيل في قائمة الأخطاء أسفل الصفحة":"");
      (f.warnings||[]).forEach(w=>add("الاستيراد","تحذير — "+l,"",w));
    }
  }
  return {head:["المجال","البند","العدد","تفاصيل"],rows};
}

return {followUp,suspectDups,nameKey,fuzzy,num,clean,sum,parseDate,dateOrder,parseSheet,crossCheck,buildModel,suggest,statement,reconcile,filt,REPORTS,quality,SCHEMA,isD,dn,dice};
})();

let xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error("تعذّر تحميل أداة Excel"))};document.head.appendChild(s)});
  return xlsxP;
}
const safeCell=v=>typeof v==="string"&&/^[=+\-@\t\r]/.test(v)&&isNaN(Number(v))?"'"+v:v;   /* منع حقن الصيغ في Excel */
async function xport(name,sheets){
  sheets=sheets.map(([t,rows])=>[String(t).replace(/[\\\/?*\[\]:]/g,"-").slice(0,31)||"ورقة",rows.map(r=>r.map(safeCell))]);
  try{
    await loadXLSX();const wb=XLSX.utils.book_new();
    sheets.forEach(([t,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),t));
    wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,`${name}-${isoD(new Date())}.xlsx`);
  }catch(e){
    const csv="﻿"+sheets.map(([t,rows])=>t+"\n"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n")).join("\n\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`${name}-${isoD(new Date())}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
}

const LIM=300;
function tblHtml(T,id){
  const so=st.sort[id],idx=T.rows.map((_,i)=>i);
  if(so)idx.sort((a,b)=>{const x=T.rows[a][so.i],y=T.rows[b][so.i];const r=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"ar",{numeric:true});return so.d*r});
  const lim=st.all[id]?idx.length:LIM,show=idx.slice(0,lim);
  const th=T.head.map((h,i)=>`<th class="${T.num.includes(i)?"n":""}" data-sort="${esc(id)}:${i}" aria-sort="${so&&so.i===i?(so.d>0?"ascending":"descending"):"none"}">${esc(h)}${so&&so.i===i?(so.d>0?" ▲":" ▼"):""}</th>`).join("");
  const cell=(v,i)=>`<td class="${T.num.includes(i)?"n":""}">${typeof v==="number"&&T.num.includes(i)?`<bdi dir="ltr">${fm(v)}</bdi>`:esc(v)}</td>`;
  const body=show.map(i=>`<tr${T.links&&T.links[i]!=null&&T.links[i]!==""?` data-c="${esc(T.links[i])}"`:""}>${T.rows[i].map(cell).join("")}</tr>`).join("");
  return `<h3>${esc(T.title)} <span class="mut">(${T.rows.length} صف)</span></h3>${T.rows.length?`<div class="tw"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${T.foot?`<tfoot><tr>${T.foot.map(cell).join("")}</tr></tfoot>`:""}</table></div>${idx.length>lim?`<button class="btn alt sm noprint" data-more="${esc(id)}" style="margin-top:6px">عرض كل الصفوف (${idx.length})</button>`:""}`:'<div class="mut" style="padding:10px">لا توجد صفوف</div>'}${T.note?`<div class="mut">${esc(T.note)}</div>`:""}`;
}

const h32=(s,seed)=>{let h=seed>>>0;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619)>>>0;return h};
const chkOf=a=>{let h=2166136261;for(const s of a)h=h32(s,h);return h.toString(36)+":"+a.reduce((n,s)=>n+s.length,0)};
async function loadAll(){
  st.loadErr=null;st.data=null;st.model=null;
  const [c,p,al]=await Promise.all([getDoc(doc(db,"company","current")),isAdmin()?getDoc(doc(db,"company","previous")).catch(()=>null):null,getDoc(doc(db,"company","aliases")).catch(()=>null)]);
  st.cur=c.exists()?c.data():null;st.prev=p&&p.exists()?p.data():null;st.aliases=al&&al.exists()?(al.data().list||[]):[];
  if(!st.cur)return;
  const snap=await getDocs(collection(db,"company",st.cur.id,"chunks")),parts=[];
  snap.forEach(d=>parts.push({id:d.id,...d.data()}));
  parts.sort((a,b)=>a.id<b.id?-1:1);
  const data={debts:[],sales:[],pays:[]};
  try{
    if(parts.length!==st.cur.nChunks)throw new Error("عدد أجزاء البيانات غير مطابق");
    if(chkOf(parts.map(x=>x.j))!==st.cur.chk)throw new Error("بصمة البيانات غير مطابقة");
    for(const x of parts)data[x.kind].push(...JSON.parse(x.j));
    for(const k of ["debts","sales","pays"])if(data[k].length!==st.cur.counts[k])throw new Error("عدد الصفوف غير مطابق: "+k);
  }catch(e){st.loadErr="فشل التحقق من سلامة البيانات المخزنة ("+e.message+"). لم تُعرض أي بيانات. أعد الاستيراد أو استخدم «الرجوع لآخر نسخة سليمة»";return}
  st.data=data;rebuildModel();
}
function rebuildModel(){const m={};st.aliases.forEach(x=>{m[x.a]=x.t});st.model=HS.buildModel(st.data,m)}
const hasData=()=>!!st.model;

  st.user=u;st.me=null;st.model=null;st.data=null;
  if(!u){if(!st.signingUp)showLogin();return}
  if(st.signingUp)return;
  await boot();
});
async function boot(){
  shell('<div class="panel mut">جاري التحميل…</div>');
  try{
    if(isRoot())st.me={status:"approved",role:"admin",name:"المدير الأساسي",email:st.user.email||""};
    let me=isRoot()?null:await getDoc(doc(db,"users",st.user.uid));
    if(isRoot()){}else if(!me.exists()){
      const rec={email:st.user.email||"",name:(st.user.email||"").split("@")[0].slice(0,80),phone:"",status:"pending",createdAt:Date.now()};
      await setDoc(doc(db,"users",st.user.uid),rec);st.me=rec
    }else st.me=me.data();
    if(st.me.status!=="approved"){showGate();return}
    await loadAll();
    show("home");
  }catch(e){shell(errBox(e))}
}
function showGate(){
  const s=st.me&&st.me.status,msg=s==="rejected"?"تم رفض طلب التسجيل. تواصل مع المدير.":s==="disabled"?"تم إيقاف حسابك. تواصل مع المدير.":"طلبك وصل وبانتظار موافقة المدير.";
  app.innerHTML=`<div class="login"><img class="logo" src="${LOGO}" alt=""><div class="${s==="rejected"||s==="disabled"?"err":"warn"}">${msg}</div><button class="btn" data-act="recheck">تحديث الحالة</button><button class="btn alt" data-act="logout">خروج</button></div>`;
}
function showLogin(mode="in"){
  const up=mode==="up";
  app.innerHTML=`<div class="login"><img class="logo" src="${LOGO}" alt="شعار الحاج سلامة للمجمدات"><form id="lf">${up?'<label for="nm">الاسم</label><input id="nm" autocomplete="name" required maxlength="80"><label for="ph">رقم الموبايل</label><input id="ph" type="tel" dir="ltr" autocomplete="tel" maxlength="20">':""}<label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username" required><label for="pw">كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="${up?"new-password":"current-password"}" required minlength="6"><div id="le" class="err" hidden></div><button id="lb" class="btn" type="submit">${up?"إرسال طلب التسجيل":"دخول"}</button></form><button class="btn alt" id="sw" type="button">${up?"لدي حساب، دخول":"طلب حساب جديد"}</button></div>`;
  $("#sw").onclick=()=>showLogin(up?"in":"up");
  $("#lf").onsubmit=async e=>{
    e.preventDefault();const b=$("#lb"),le=$("#le");b.disabled=true;le.hidden=true;
    const email=$("#em").value.trim(),pw=$("#pw").value;
    if(!up){try{await signInWithEmailAndPassword(auth,email,pw)}catch(err){le.textContent=authMsg(err.code);le.hidden=false;b.disabled=false}return}
    const name=$("#nm").value.trim(),phone=$("#ph").value.trim();
    if(name.length<2){le.textContent="اكتب الاسم";le.hidden=false;b.disabled=false;return}
    st.signingUp=true;
    try{
      const cr=await createUserWithEmailAndPassword(auth,email,pw);
      await setDoc(doc(db,"users",cr.user.uid),{email:cr.user.email,name:name.slice(0,80),phone:phone.slice(0,20),status:"pending",createdAt:Date.now()});
      st.signingUp=false;await boot();
    }catch(err){
      if(auth.currentUser)await signOut(auth);
      st.signingUp=false;showLogin("up");
      const l=$("#le");l.textContent=err.code?authMsg(err.code):"تعذّر إرسال الطلب، حاول مرة أخرى";l.hidden=false;
    }
  };
}

/* ---------- الإطار العام ---------- */
function shell(inner){
  const tabs=[["home","الرئيسية"],["cust","العملاء"],["rep","التقارير"],["follow","المتابعة"],["audit","المراجعة والتسوية"]];
  if(isAdmin())tabs.push(["imp","الاستيراد"],["users","المستخدمون"]);
  app.innerHTML=`<header class="top"><div class="top-in"><div class="brand"><img src="${LOGO}" alt=""><span class="t">الحاج سلامة للمجمدات<span class="src">نظام رقابة ومتابعة مالية — يعرض بيانات «حساباتي» كما هي${st.cur?" · آخر استيراد: "+esc(stamp(st.cur.at)):""}</span></span></div><span><button class="hb" data-act="reload">تحديث</button> <button class="hb" data-act="logout">خروج</button></span></div><nav class="tabs" aria-label="الأقسام">${tabs.map(([k,l])=>`<button data-tab="${k}" ${st.tab===k?'aria-current="true"':""}>${l}</button>`).join("")}</nav></header><main id="main">${inner||""}</main>`;
}
function show(tab,arg){
  st.tab=tab;
  if(tab==="cust"&&arg!==undefined)st.cid=arg;
  if(tab==="home")viewHome();else if(tab==="cust")st.cid!=null&&arg!==null?viewCustomer():viewCustomers();else if(tab==="rep")viewReports();else if(tab==="follow")viewFollow();else if(tab==="audit")viewAudit();else if(tab==="imp"&&isAdmin())viewImport();else if(tab==="users"&&isAdmin()){shell('<div id="ulist" class="panel mut">جاري التحميل…</div>');usersInit()}else viewHome();
  scrollTo(0,0);
}
const gate=()=>{
  if(st.loadErr){shell(`<div class="err">${esc(st.loadErr)}</div>${isAdmin()&&st.prev?'<button class="btn" data-act="rollback">الرجوع لآخر نسخة سليمة</button>':""}`);return true}
  if(!hasData()){shell(`<div class="warn">لا توجد بيانات معتمدة بعد.${isAdmin()?" ارفع ملفات حساباتي الثلاثة من تبويب «الاستيراد».":" يجب أن يرفع المدير الملفات."}</div>`);return true}
  return false;
};

/* ---------- الرئيسية ---------- */
function monthsChart(m){
  const g=new Map();for(const v of m.inv){const k=v.d.slice(0,7);(g.get(k)||g.set(k,[0,0]).get(k))[0]+=v.t}
  for(const y of m.pay){const k=y.d.slice(0,7);(g.get(k)||g.set(k,[0,0]).get(k))[1]+=y.a}
  const ks=[...g.keys()].sort().slice(-12),mx=Math.max(1,...ks.flatMap(k=>g.get(k)));
  return `<div class="bar" role="img" aria-label="المبيعات والتحصيلات الشهرية">${ks.map(k=>`<div title="${esc(k)}: مبيعات ${fm(g.get(k)[0])} | تحصيلات ${fm(g.get(k)[1])}"><i style="height:${g.get(k)[0]/mx*100}%;background:var(--acc)"></i><i style="height:${g.get(k)[1]/mx*100}%;background:var(--gold)"></i></div>`).join("")}</div><div class="bar" style="height:auto;margin:0">${ks.map(k=>`<div class="mut" style="justify-content:center;font-size:10.5px">${esc(k.slice(2))}</div>`).join("")}</div><div class="lg"><span><s style="background:var(--acc)"></s>المبيعات</span><span><s style="background:var(--gold)"></s>التحصيلات (ملف الدفعات)</span></div>`;
}
function viewHome(){
  if(gate())return;
  const m=st.model,R=HS.reconcile(m),cur=st.cur,ym=(cur.range?.max||isoD(new Date())).slice(0,7);
  const mi=m.inv.filter(v=>v.d.startsWith(ym)),mp=m.pay.filter(y=>y.d.startsWith(ym));
  const top=m.C.filter(c=>c.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,8);
  shell(`${kpis([["صافي أرصدة العملاء",R.net],["إجمالي الأرصدة المدينة",R.pos],["إجمالي الأرصدة الدائنة",R.neg],["عدد العملاء في المديونيات",R.nCust,1],["عملاء غير مطابقين",R.nUnm,1],["إجمالي المبيعات (كل الفترة)",R.S],["إجمالي التحصيلات (كل الفترة)",R.P],["مبيعات "+ym,HS.sum(mi,v=>v.t)],["تحصيلات "+ym,HS.sum(mp,y=>y.a)]])}
  ${R.nUnm?`<div class="warn">يوجد ${R.nUnm} عميل في المبيعات/الدفعات غير موجودين في كشف المديونيات (${R.unmInv} فاتورة، ${R.unmPay} دفعة). <button class="chip" data-go="audit">راجعهم</button></div>`:""}
  <div class="row2"><div class="panel"><h3 style="margin-top:0">المبيعات والتحصيلات — آخر 12 شهرًا</h3>${monthsChart(m)}</div>
  <div class="panel"><h3 style="margin-top:0">أعلى العملاء مديونية</h3><div class="tw" style="max-height:260px"><table class="tbl"><tbody>${top.map(c=>`<tr data-c="${c.id}"><td>${esc(c.n)}</td><td class="n debt">${fm(c.bal)}</td></tr>`).join("")}</tbody></table></div></div></div>
  ${(()=>{const X=HS.followUp(m,isoD(new Date()),30);return `<div class="panel"><h3 style="margin-top:0">تنبيهات المتابعة (30 يومًا)</h3><div class="chips"><button class="chip" data-fw="late" data-go="follow">مدينون متأخرون في السداد: ${X.late.length+X.lateNone.length}</button><button class="chip" data-fw="idle" data-go="follow">توقفوا عن الشراء: ${X.idle.length}</button><button class="chip" data-fw="dups" data-go="follow">فواتير مشتبه تكرارها: ${HS.suspectDups(m).length}</button></div></div>`})()}
  <div class="panel"><h3 style="margin-top:0">حالة البيانات</h3><div class="mut">الاستيراد المعتمد: ${esc(stamp(cur.at))} · بواسطة ${esc(cur.email||"")}</div>
  ${["debts","sales","pays"].map(k=>{const f=cur.files?.[k]||{};return `<div class="mut">• ${esc(HS.SCHEMA[k].label)}: ${esc(f.name||"")} — ${fm(cur.counts[k])} صف${f.range?` · الفترة ${esc(fd(f.range.min))} إلى ${esc(fd(f.range.max))}`:""}${f.printed?` · تاريخ التقرير ${esc(fd(f.printed))}`:""}</div>`}).join("")}
  <div class="info" style="margin-top:8px">الأرصدة الحالية من ملف المديونيات فقط. التقارير مشتقة من ملفي المبيعات والدفعات كما وردا بلا حذف أو تعديل.</div></div>`);
}

/* ---------- العملاء ---------- */
function viewCustomers(){
  if(gate())return;
  const m=st.model,q=st.q?HS.fuzzy(st.q):"",raw=st.q.trim();
  let C=m.C.filter(c=>(!q||HS.fuzzy(c.n).includes(q)||(raw&&(c.ph.includes(raw)||c.mb.includes(raw))))&&({all:1,debt:c.bal>0,neg:c.bal<0,zero:c.bal===0,none:!c.mv.length}[st.cf]));
  C=[...C].sort(st.cs==="bal"?(a,b)=>b.bal-a.bal:st.cs==="inv"?(a,b)=>(b.lastInv||"").localeCompare(a.lastInv||""):st.cs==="pay"?(a,b)=>(b.lastPay||"").localeCompare(a.lastPay||""):(a,b)=>a.n.localeCompare(b.n,"ar"));
  const F=[["all","الكل"],["debt","مدين"],["neg","رصيد سالب"],["zero","رصيد صفري"],["none","بلا حركات"]],S=[["name","الاسم"],["bal","الأعلى رصيدًا"],["inv","آخر فاتورة"],["pay","آخر دفعة"]];
  const T={title:"العملاء",head:["العميل","الهاتف","الرصيد (حساباتي)","آخر فاتورة","آخر دفعة","فواتير","دفعات"],num:[2,5,6],links:C.map(c=>c.id),rows:C.map(c=>[c.n,c.ph||c.mb,c.bal,c.lastInv?fd(c.lastInv):"—",c.lastPay?fd(c.lastPay):"—",c.inv.length,c.pay.length]),foot:["الإجمالي","",HS.sum(C,c=>c.bal),"","",HS.sum(C,c=>c.inv.length),HS.sum(C,c=>c.pay.length)]};
  shell(`<div class="panel noprint"><input id="q" type="search" placeholder="ابحث بالاسم أو رقم الهاتف" value="${esc(st.q)}" aria-label="بحث"><div class="chips">${F.map(([k,l])=>`<button class="chip" data-cf="${k}" aria-pressed="${st.cf===k}">${l}</button>`).join("")}<span class="mut" style="align-self:center">ترتيب:</span>${S.map(([k,l])=>`<button class="chip" data-cs="${k}" aria-pressed="${st.cs===k}">${l}</button>`).join("")}</div></div>${printHead("أرصدة العملاء")}<div id="ct">${tblHtml(T,"cust")}</div><div class="chips noprint"><button class="btn alt sm" data-act="xcust">تصدير Excel</button><button class="btn alt sm" data-act="print">طباعة</button></div>`);
  st._custT=T;
}

function custOf(id){
  const m=st.model;
  if(typeof id==="string"&&id.startsWith("u:")){const k=id.slice(2),u=m.unmatched.find(x=>x.k===k);return u?{un:true,u,n:u.n,inv:u.inv,pay:u.pay}:null}
  const c=m.C[+id];return c?{c,n:c.n,inv:c.inv,pay:c.pay}:null;
}
function defaultRange(){
  const to=st.cur?.range?.max||isoD(new Date());
  return {from:to.slice(0,8)+"01",to};
}
function viewCustomer(){
  if(gate())return;
  const X=custOf(st.cid);if(!X){st.cid=null;return viewCustomers()}
  if(!st.sf.from){Object.assign(st.sf,defaultRange())}
  const back='<button class="btn alt sm noprint" data-act="back">‹ رجوع للقائمة</button>';
  if(X.un)return viewUnmatched(X,back);
  const c=X.c;
  shell(`${back}<div class="panel"><div class="mut">عميل في كشف المديونيات${HS.fuzzy(c.n)&&st.model.dupKeys.has(c.key)?' <span class="badge">اسم مكرر في المديونيات</span>':""}</div><h2 style="margin:2px 0">${esc(c.n)}</h2>
  <div class="big ${cls(c.bal)}">${fm(c.bal)} <span style="font-size:15px">جنيه</span></div><div class="mut">${c.bal>0?"مطلوب من العميل":c.bal<0?"رصيد دائن للعميل (له عندنا)":"رصيد صفري"} — الرصيد الحالي كما ورد في ملف المديونيات (استيراد ${esc(stamp(st.cur.at))})</div>
  ${[c.ph,c.mb].filter(Boolean).map(p=>`<div>📞 <a href="tel:${esc(p.replace(/[^\d+]/g,""))}" dir="ltr">${esc(p)}</a></div>`).join("")}</div>
  <div class="chips noprint">${[["stmt","كشف الحساب"],["inv","الفواتير ("+c.inv.length+")"],["pay","الدفعات ("+c.pay.length+")"]].map(([k,l])=>`<button class="chip" data-ct="${k}" aria-pressed="${st.ctab===k}">${l}</button>`).join("")}</div><div id="cb"></div>`);
  customerBody(X);
}
function customerBody(X){
  const c=X.c,box=$("#cb");

    const T={title:"فواتير العميل",head:["التاريخ","رقم الفاتورة","الإجمالي","المدفوع","المتبقي","المندوب","ملاحظات","تنبيه"],num:[2,3,4],rows:[...c.inv].sort((a,b)=>b.d.localeCompare(a.d)).map(v=>[fd(v.d),v.no,v.t,v.p,v.r,v.s,v.x,Math.abs(v.t-v.p-v.r)>0.005?"الإجمالي ≠ المدفوع+المتبقي":""]),foot:["الإجمالي","",HS.sum(c.inv,v=>v.t),HS.sum(c.inv,v=>v.p),HS.sum(c.inv,v=>v.r),"","",""],note:"«المتبقي» وقت إصدار الفاتورة، وليس رصيد العميل الحالي."};
    box.innerHTML=printHead("فواتير "+c.n)+tblHtml(T,"cinv")+`<div class="chips noprint"><button class="btn alt sm" data-act="xtbl" data-n="فواتير-${esc(c.n.slice(0,20))}">تصدير Excel</button><button class="btn alt sm" data-act="print">طباعة</button></div>`;st._xt=[tblSheet(T)];
  }else if(st.ctab==="pay"){
    const T={title:"دفعات العميل",head:["التاريخ","المبلغ","النوع","ملاحظات"],num:[1],rows:[...c.pay].sort((a,b)=>b.d.localeCompare(a.d)).map(y=>[fd(y.d),y.a,y.link!=null?"مرتبطة بمدفوع فاتورة "+y.link:"دفعة مستقلة",y.x]),foot:["الإجمالي",HS.sum(c.pay,y=>y.a),"",""],note:"«مرتبطة» = مطابقة لمدفوع داخل فاتورة (نفس العميل والتاريخ والمبلغ). هي مدرجة في ملف الدفعات أصلًا ولا تُحسب مرتين."};
    box.innerHTML=printHead("دفعات "+c.n)+tblHtml(T,"cpay")+`<div class="chips noprint"><button class="btn alt sm" data-act="xtbl" data-n="دفعات-${esc(c.n.slice(0,20))}">تصدير Excel</button><button class="btn alt sm" data-act="print">طباعة</button></div>`;st._xt=[tblSheet(T)];
  }else stmtBody(c,box);
}
function stmtBody(c,box){
  const {from,to,mode}=st.sf;
  const bad=!HS.isD(from)||!HS.isD(to)||from>to;
  const R=bad?null:HS.statement(c,from,to,mode);
  const P=[["m","الشهر الحالي"],["30","آخر 30 يومًا"],["y","آخر سنة"],["all","كل الحركات"]];
  box.innerHTML=`<div class="panel noprint"><div class="flt"><div><label for="sf">من تاريخ</label><input type="date" id="sf" value="${esc(from)}"></div><div><label for="se">إلى تاريخ</label><input type="date" id="se" value="${esc(to)}"></div><div><label for="sm">نوع الكشف</label><select id="sm"><option value="full"${mode==="full"?" selected":""}>كامل (كل حركة)</option><option value="short"${mode==="short"?" selected":""}>مختصر (يوميًا)</option></select></div></div><div class="chips">${P.map(([k,l])=>`<button class="chip" data-sp="${k}">${l}</button>`).join("")}<button class="btn sm" data-act="print">طباعة</button><button class="btn alt sm" data-act="xstmt">تصدير Excel</button></div></div>`+
  (bad?'<div class="warn">اختر فترة صحيحة (من ≤ إلى)</div>':`<div id="sprint">${printHead("كشف حساب: "+c.n,"من "+fd(from)+" إلى "+fd(to))}
  ${kpis([["رصيد بداية الفترة (مستنتج)",R.open],["مبيعات الفترة (فواتير)",R.dr],["تحصيلات الفترة",R.cr],["رصيد نهاية الفترة",R.close]])}
  <div class="info">كشف الحساب التاريخي <b>مستنتج</b> من الرصيد الحالي في ملف المديونيات والحركات المسجلة في ملفي المبيعات والدفعات، وليس رصيدًا تاريخيًا صادرًا مباشرة من برنامج حساباتي. الفاتورة تُخصم بإجماليها، والدفعات من ملف الدفعات فقط (المدفوع داخل الفاتورة مدرج في الدفعات ولا يُحسب مرتين).${R.beforeFirst?` أول حركة محفوظة بتاريخ ${esc(fd(R.first))}، فالرصيد قبل هذا التاريخ مستنتج ولا يمكن تأكيده.`:""}</div>
  <div class="tw"><table class="tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th class="n">مدين (فواتير)</th><th class="n">دائن (دفعات)</th><th class="n">الرصيد</th></tr></thead><tbody>
  <tr><td>${esc(fd(from))}</td><td><b>رصيد بداية الفترة (مستنتج)</b></td><td></td><td></td><td class="n"><b>${fm(R.open)}</b></td></tr>
  ${R.rows.length?R.rows.map(m=>mode==="short"?`<tr><td>${esc(fd(m.d))}</td><td>${m.n} حركة</td><td class="n">${m.dr?fm(m.dr):""}</td><td class="n">${m.cr?fm(m.cr):""}</td><td class="n">${fm(m.bal)}</td></tr>`:m.o===0?`<tr><td>${esc(fd(m.d))}</td><td>فاتورة رقم ${esc(m.no)} <span class="mut">(مدفوع منها ${fm(m.ref.p)}، متبقي ${fm(m.ref.r)}${m.ref.s?" · "+esc(m.ref.s):""}) ${Math.abs(m.ref.t-m.ref.p-m.ref.r)>0.005?'<span class="tag">الإجمالي ≠ المدفوع+المتبقي</span>':""}</span></td><td class="n">${fm(m.dr)}</td><td></td><td class="n">${fm(m.bal)}</td></tr>`:`<tr><td>${esc(fd(m.d))}</td><td>${m.ref.link!=null?"دفعة مسدّدة مع فاتورة رقم "+esc(m.ref.link):"دفعة / تحصيل"}${m.ref.x?" — "+esc(m.ref.x):""}</td><td></td><td class="n">${fm(m.cr)}</td><td class="n">${fm(m.bal)}</td></tr>`).join(""):'<tr><td colspan="5" class="mut">لا توجد حركات في هذه الفترة</td></tr>'}
  </tbody><tfoot><tr><td>${esc(fd(to))}</td><td>رصيد نهاية الفترة (مستنتج)</td><td class="n">${fm(R.dr)}</td><td class="n">${fm(R.cr)}</td><td class="n">${fm(R.close)}</td></tr></tfoot></table></div></div>`);
  st._stmt=R?{c,R,from,to,mode}:null;

function resolveCust(name){

async function readSheet(file){
  await loadXLSX();
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:false,cellNF:true});
  const ws=wb.Sheets[wb.SheetNames[0]],rg=XLSX.utils.decode_range(ws["!ref"]||"A1"),rows=[];
  for(let R=rg.s.r;R<=rg.e.r;R++){
    const row=[];
    for(let C=0;C<=rg.e.c;C++){
      const c=ws[XLSX.utils.encode_cell({r:R,c:C})];let v="";
      if(c){
        if(c.t==="n"&&c.z&&XLSX.SSF.is_date(c.z)){const p=XLSX.SSF.parse_date_code(c.v);v=`${p.y}-${pad2(p.m)}-${pad2(p.d)}`}
        else if(c.t==="n")v=c.v;else v=c.w??c.v??"";
      }
      row.push(v);
    }
    rows.push(row);
  }
  return {rows,firstRow:rg.s.r+1};
}
async function onFile(kind,file){
  delete st.imp[kind];renderImpAll();

    if(file.size>20*1024*1024)throw new Error("حجم الملف أكبر من 20 ميجا");
    if(!file.size)throw new Error("الملف فارغ");
    let sh;try{sh=await readSheet(file)}catch(e){throw new Error("تعذّرت قراءة الملف (تالف أو غير صالح)")}
    const res=HS.parseSheet(kind,sh.rows,sh.firstRow);
    st.imp[kind]={res,name:file.name,size:file.size};
  }catch(e){st.imp[kind]={res:{critical:[e.message||"خطأ غير معروف"],errors:[],warnings:[],notes:[],items:[],skipped:{other:[]}},name:file.name,fail:true}}
  renderImpAll();
}

  <div id="iprog" class="mut"></div><button class="btn" id="iapply" data-act="apply" style="margin-top:8px">اعتماد الاستيراد كوحدة واحدة</button></div>`;

function packRows(kind,items,limit=250000){
  const enc=new TextEncoder(),out=[];let cur=[],bytes=0;
  const flush=()=>{if(cur.length){out.push({kind,n:cur.length,j:"["+cur.join(",")+"]"});cur=[];bytes=0}};
  for(const it of items){const s=JSON.stringify(it),b=enc.encode(s).length+1;if(bytes+b>limit)flush();cur.push(s);bytes+=b}
  flush();return out;
}
const newId=()=>"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function delChunks(id){const s=await getDocs(collection(db,"company",id,"chunks")),ps=[];s.forEach(d=>ps.push(deleteDoc(d.ref||doc(db,"company",id,"chunks",d.id))));await Promise.all(ps)}
async function applyImport(btn){
  const K=["debts","sales","pays"],P={debts:st.imp.debts.res,sales:st.imp.sales.res,pays:st.imp.pays.res},prog=$("#iprog");
  if(K.some(k=>P[k].critical.length))return;

  const id=newId(),oldCur=st.cur,oldPrev=st.prev;let written=[],committed=false;
  try{
    const docs=[];
    K.forEach(k=>packRows(k,P[k].items).forEach((c,i)=>docs.push({cid:`${k}_${String(i).padStart(4,"0")}`,...c})));
    docs.sort((a,b)=>a.cid<b.cid?-1:1);
    for(let i=0;i<docs.length;i++){say(`جاري حفظ الجزء ${i+1} من ${docs.length}…`);await setDoc(doc(db,"company",id,"chunks",docs[i].cid),{kind:docs[i].kind,n:docs[i].n,j:docs[i].j});written.push(docs[i].cid)}
    say("جاري التحقق من البيانات المحفوظة…");
    const snap=await getDocs(collection(db,"company",id,"chunks")),back=new Map();snap.forEach(d=>back.set(d.id,d.data()));
    if(back.size!==docs.length)throw new Error("عدد الأجزاء المحفوظة غير مطابق");
    for(const d of docs){const b=back.get(d.cid);if(!b||b.j!==d.j||b.n!==d.n)throw new Error("فشل التحقق من الجزء "+d.cid)}
    const sums={bal:P.debts.stats.net,total:P.sales.stats.total,paid:P.sales.stats.paid,rem:P.sales.stats.rem,coll:P.pays.stats.total};
    const files={};K.forEach(k=>{const r=P[k];files[k]={name:st.imp[k].name,size:st.imp[k].size,rows:r.items.length,bad:r.errors.length,range:r.range||null,printed:r.fileDates?.to||null,warnings:r.warnings.slice(0,30),errors:r.errors.slice(0,300)}});
    const rg=[P.sales.range,P.pays.range].filter(Boolean),range=rg.length?{min:rg.map(r=>r.min).sort()[0],max:rg.map(r=>r.max).sort().reverse()[0]}:null;
    const cur={id,at:Date.now(),by:st.user.uid,email:st.user.email||"",counts:{debts:P.debts.items.length,sales:P.sales.items.length,pays:P.pays.items.length},sums,chk:chkOf(docs.map(d=>d.j)),nChunks:docs.length,files,range};
    say("جاري تحويل النظام للبيانات الجديدة (عملية واحدة)…");
    const b=writeBatch(db);

    if(oldCur)b.set(doc(db,"company","previous"),oldCur);
    b.set(doc(db,"admin","data","importLog",id),{at:cur.at,by:cur.by,email:cur.email,status:"applied",counts:cur.counts,sums,files:Object.fromEntries(K.map(k=>[k,{name:files[k].name,rows:files[k].rows,bad:files[k].bad}])),errors:K.flatMap(k=>P[k].errors.slice(0,100).map(e=>({f:k,row:e.row,msg:e.msg})))});
    await b.commit();committed=true;
    if(oldPrev&&oldPrev.id&&oldPrev.id!==id){say("حذف أقدم نسخة…");try{await delChunks(oldPrev.id)}catch(e){}}
    st.imp={};await loadAll();
    shell(`<div class="okb">تم اعتماد الاستيراد بنجاح: ${fm(cur.counts.debts)} عميل، ${fm(cur.counts.sales)} فاتورة، ${fm(cur.counts.pays)} دفعة. تم استبدال كل البيانات السابقة.</div><button class="btn" data-go="home">فتح الرئيسية</button>`);
  }catch(e){
    if(committed){   /* الاعتماد تمّ فعلًا: لا يجوز حذف أجزاء النسخة الجديدة. المشكلة في تحديث العرض فقط */

}
