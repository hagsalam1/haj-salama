<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>الحاج سلامة للمجمدات</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-lite.js">
<style>
:root{--bg:#e6f2fb;--card:#fff;--ink:#0b2a4a;--mut:#51677c;--line:#cfe2f1;--acc:#0b2a4a;--accink:#fff;--gold:#c9a24a;--debt:#b4321f;--ok:#1c7a4f;--warnbg:#fff3cd;--warnink:#5c4400;--errbg:#fde8e6;--errink:#7a1d12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a21;--card:#16272f;--ink:#e6f0f4;--mut:#93a9b4;--line:#27404b;--acc:#12304f;--debt:#ff8a76;--ok:#6fd3a0;--warnbg:#3a3112;--warnink:#f3df9a;--errbg:#3b1a16;--errink:#ffb4a6}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--acc);color:#fff;padding:10px 14px;z-index:9;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px;font-weight:800}
.hb{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer}
nav{display:flex;gap:6px;padding:10px 14px 0;max-width:680px;margin:0 auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;font:inherit;font-weight:600;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-current="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px 14px 40px;max-width:680px;margin:0 auto}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.login{max-width:380px;margin:0 auto;padding:24px 18px}
.logo{display:block;width:min(100%,280px);height:auto;margin:0 auto 14px;border-radius:16px}
.login label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
.btn{display:block;width:100%;font:inherit;font-weight:800;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;margin-top:14px;border-bottom:3px solid var(--gold)}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0}
.err{background:var(--errbg);color:var(--errink);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.warn{background:var(--warnbg);color:var(--warnink);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.okb{background:#dff5e8;color:#145a38;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.card{background:var(--card);border-radius:12px;padding:10px 12px}
.card small{color:var(--mut);display:block;font-size:12px}.card b{font-size:20px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:13px 14px;cursor:pointer}
.row:first-child{border-radius:10px 10px 0 0}.row:last-child{border-radius:0 0 10px 10px;border-bottom:0}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.debt{color:var(--debt)}.ok{color:var(--ok)}
.mut{color:var(--mut);font-size:13px}
.badge{font-size:11px;background:var(--warnbg);color:var(--warnink);padding:1px 7px;border-radius:99px;margin-right:4px}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;padding:4px 0 10px;cursor:pointer}
.panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.big{font-size:32px;font-weight:800;line-height:1.2}
.tabs{display:flex;gap:8px;margin:12px 0 8px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{background:var(--card);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;justify-content:space-between;gap:10px}
.item:first-child{border-radius:10px 10px 0 0}.item:last-child{border-radius:0 0 10px 10px;border-bottom:0}
.empty{padding:22px;text-align:center;color:var(--mut)}
a{color:inherit;font-weight:600}
.sec{font-size:15px;margin:16px 0 6px}
.file{display:block;width:100%;margin-top:8px}
.pv ul{margin:6px 0;padding-right:18px;font-size:14px}
header{background:linear-gradient(135deg,#0b2a4a,#174676)}
nav{scrollbar-width:none;padding-bottom:2px}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border-radius:99px;padding:8px 16px}
nav button[aria-current="true"]{box-shadow:0 2px 0 var(--gold)}
.card{border-top:3px solid var(--gold);box-shadow:0 1px 3px rgba(11,42,74,.1)}
.panel{box-shadow:0 1px 3px rgba(11,42,74,.1)}
.row:active{background:var(--bg)}
.item.top{border-right:4px solid var(--gold)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}.top .bar i{background:var(--gold)}
.chg{font-weight:800;font-size:13px}
.bal{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:8px;background:var(--bg);font-size:12px}
.btn.del{color:var(--debt)}
.logo.sm{width:min(100%,120px)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th,.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td.n,.tbl th.n{text-align:left;white-space:nowrap}
.tbl th{color:var(--mut);font-weight:700}
@media print{header,nav,#pb,.noprint,.back{display:none!important}body{background:#fff;color:#000}.panel{border:0;box-shadow:none}}
.chip,.btn,nav button,.hb{min-height:40px}
.sub{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.sub::-webkit-scrollbar{display:none}.sub .chip{flex:0 0 auto}
.sv{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;margin-inline-start:6px}
.sv3{background:rgba(180,35,24,.15);color:var(--debt)}.sv2{background:rgba(201,162,39,.22);color:var(--gold)}.sv1{background:var(--bg);color:var(--mut)}
tr[data-k]{cursor:pointer}tr[data-k]:active{background:var(--bg)}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.ctl label{font-size:12px;color:var(--mut)}
.okbox{background:rgba(26,127,55,.12);border:1px solid rgba(26,127,55,.35);color:var(--ok);padding:10px 12px;border-radius:12px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>

const num=v=>{if(typeof v==="number")return v;const t=normAr(v).replace(/[,\s]/g,"");return /^-?\d+(\.\d+)?$/.test(t)?Number(t):NaN};
const r2=v=>Math.round(v*100)/100;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const mk=(y,m,d)=>{if(m<1||m>12||d<1||d>31)return null;const t=new Date(Date.UTC(y,m-1,d));if(t.getUTCMonth()!==m-1)return null;return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`};
function parseDate(v,mode){
  const t=normAr(v);let m;
  if((m=t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)))return mk(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))){
    const a=+m[1],b=+m[2],y=+m[3];let mo,d;
    if(a>12){d=a;mo=b}else if(b>12){mo=a;d=b}else if(mode==="dmy"){d=a;mo=b}else{mo=a;d=b}
    return mk(y,mo,d);
  }
  return null;
}
const fm=v=>Number(v).toLocaleString("en-US",{maximumFractionDigits:2});
const fd=s=>s?String(s).replace(/-/g,"/"):"—";
const daysSince=li=>{const [y,m,d]=li.split("-").map(Number);const n=new Date();return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(y,m-1,d))/864e5)};

/* ---------- قراءة وفحص ملفات Excel ---------- */
const SCHEMA={
  balances:{label:"المديونيات",need:{name:["اسم العميل"],bal:["رصيد"]},opt:{phone:["الهاتف"],mobile:["الموبايل"]}},
  sales:{label:"المبيعات",need:{inv:["رقم الفاتور"],date:["التاريخ"],name:["اسم العميل"],total:["الاجمالي"],paid:["المدفوع"],rem:["الباقي","المتبقي"]},opt:{seller:["اسم البائع"],notes:["ملاحظات"]}},
  payments:{label:"الدفعات",need:{name:["اسم العميل"],amt:["المبلغ"],date:["التاريخ"]},opt:{notes:["ملاحظات"]}}
};
const FOOT=/^(ال)?(مبيعات|خصومات|صافي|اجمالي|مجموع)(\s|:|$)/;
let xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error("تعذّر تحميل أداة قراءة Excel، جرّب تاني"))};document.head.appendChild(s)});
  return xlsxP;
}
async function readSheet(file){
  await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true,dateNF:"yyyy-mm-dd"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:"yyyy-mm-dd",defval:""});
}
function headerMap(rows,kind){
  const sc=SCHEMA[kind];let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){if(rows[i].some(c=>normAr(c).includes("اسم العميل"))){hi=i;break}}
  if(hi<0)return {err:"لم أجد صف العناوين (اسم العميل) في الملف"};
  const hdr=rows[hi].map(normAr),col={},miss=[];
  const find=al=>hdr.findIndex(h=>h&&al.some(a=>h.includes(normAr(a))));
  for(const [f,al] of Object.entries(sc.need)){const i=find(al);if(i<0)miss.push(al[0]);else col[f]=i}
  for(const [f,al] of Object.entries(sc.opt)){const i=find(al);if(i>=0)col[f]=i}
  if(miss.length)return {err:"أعمدة ناقصة: "+miss.join("، "),seen:rows[hi].filter(Boolean)};
  return {hi,col};
}
function parseSheet(kind,rows){
  const out={kind,critical:[],warnings:[],items:[],skipped:0,range:null};
  const hm=headerMap(rows,kind);
  if(hm.err){out.critical.push(hm.err+(hm.seen?` (الأعمدة الموجودة: ${hm.seen.join(" | ")})`:""));return out}
  const {hi,col}=hm,errs=[],seen=new Map();let total=0,dupes=0,mism=0,dupNames=[];
  const maxD=iso(new Date(Date.now()+864e5));
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i],name=String(r[col.name]??"").trim();
    if(!name||FOOT.test(normAr(name))||/www\./i.test(name)){out.skipped++;continue}
    const ln=i+1;
    if(kind==="balances"){
      total++;const bal=num(r[col.bal]);
      if(isNaN(bal)){errs.push(`سطر ${ln}: الرصيد غير صالح`);continue}
      const k=keyOf(name);
      if(seen.has(k)){dupNames.push(name);continue}
      seen.set(k,{k,n:name,ph:String(r[col.phone]??"").trim(),mb:String(r[col.mobile]??"").trim(),bal:r2(bal)});
    }else if(kind==="sales"){
      const no=normAr(r[col.inv]);
      if(!no){out.skipped++;continue}
      total++;
      const d=parseDate(r[col.date],"mdy"),t=num(r[col.total]),p=num(r[col.paid]),rm=num(r[col.rem]);
      if(!d||isNaN(t)||isNaN(p)||isNaN(rm)||d>maxD||d<"2015-01-01"){errs.push(`سطر ${ln}: الفاتورة ${no} فيها تاريخ أو رقم غير صالح`);continue}
      if(Math.abs(t-p-rm)>0.01)mism++;
      if(seen.has(no))dupes++;
      seen.set(no,{k:keyOf(name),n:name,no,d,t:r2(t),p:r2(p),r:r2(rm),s:String(r[col.seller]??"").trim(),x:String(r[col.notes]??"").trim()});
    }else{
      total++;
      const d=parseDate(r[col.date],"ymd"),a=num(r[col.amt]);
      if(!d||isNaN(a)||d>maxD||d<"2015-01-01"){errs.push(`سطر ${ln}: دفعة فيها تاريخ أو مبلغ غير صالح`);continue}
      seen.set("p"+i,{k:keyOf(name),n:name,d,a:r2(a),x:String(r[col.notes]??"").trim()});
    }
  }
  out.items=[...seen.values()];
  if(!out.items.length)out.critical.push("لا توجد صفوف صالحة في الملف");
  if(errs.length>Math.max(3,Math.floor(total*0.1)))out.critical.push(`عدد الصفوف التالفة كبير (${errs.length} من ${total})`);
  if(errs.length)out.warnings.push(`${errs.length} صف تالف اتجاهل: ${errs.slice(0,5).join("؛ ")}${errs.length>5?"…":""}`);
  if(dupes)out.warnings.push(`${dupes} فاتورة مكررة في الملف (اتاخدت آخر نسخة)`);
  if(mism)out.warnings.push(`${mism} فاتورة الإجمالي - المدفوع مش بيساوي الباقي`);
  if(dupNames.length)out.warnings.push(`أسماء مكررة في المديونيات (هتظهر مرة واحدة): ${[...new Set(dupNames)].slice(0,5).join("، ")}`);
  if(kind!=="balances"&&out.items.length){const ds=out.items.map(i=>i.d).sort();out.range={min:ds[0],max:ds[ds.length-1]}}
  return out;
}

/* ---------- خطة الحفظ ---------- */
async function planDetail(kind,res){
  const coll=kind==="sales"?"inv":"pay";
  const snap=await getDocs(collection(db,"company","data",coll));
  const ex=new Map();snap.forEach(d=>ex.set(d.id,d.data()));
  const strip=kind==="sales"?(i=>({no:i.no,d:i.d,t:i.t,p:i.p,r:i.r,s:i.s||"",x:i.x||""})):(i=>({d:i.d,a:i.a,x:i.x||""}));
  const sg=kind==="sales"?(i=>[i.no,i.d,i.t,i.p,i.r,i.s,i.x].join("|")):(i=>[i.d,i.a,i.x].join("|"));
  const byK=new Map();
  for(const it of res.items){if(!byK.has(it.k))byK.set(it.k,{n:it.n,list:[]});byK.get(it.k).list.push(strip(it))}
  const inR=()=>true;
  const ops=[],touched=[],big=[];let added=0,updated=0,removed=0,oldTotal=0;
  for(const k of new Set([...ex.keys(),...byK.keys()])){
    const old=(ex.get(k)?.list||[]).map(strip),fresh=byK.get(k)?.list||[];oldTotal+=old.length;
    const nos=new Set(fresh.map(f=>f.no));
    const keep=old.filter(o=>!inR(o.d)&&!(kind==="sales"&&nos.has(o.no)));
    const gone=old.filter(o=>!keep.includes(o));
    if(kind==="sales"){
      const on=new Map(old.map(o=>[o.no,o]));
      for(const f of fresh){const o=on.get(f.no);if(!o)added++;else if(sg(o)!==sg(f))updated++}
      removed+=gone.filter(g=>!nos.has(g.no)).length;
    }else{
      const cnt=new Map();
      gone.map(sg).forEach(s=>cnt.set(s,(cnt.get(s)||0)+1));
      fresh.map(sg).forEach(s=>{if(cnt.get(s)>0)cnt.set(s,cnt.get(s)-1);else added++});
      cnt.forEach(v=>{removed+=v});
    }
    const nl=[...keep,...fresh].sort(kind==="sales"?(a,b)=>b.d.localeCompare(a.d)||b.no.localeCompare(a.no):(a,b)=>b.d.localeCompare(a.d)||b.a-a.a);
    if(nl.length===old.length&&nl.map(sg).sort().join("¦")===old.map(sg).sort().join("¦"))continue;
    const n=byK.get(k)?.n||ex.get(k)?.n||"";
    if(JSON.stringify(nl).length>800000)big.push(n);
    touched.push({k,n,list:nl});
    ops.push(nl.length?{type:"set",ref:doc(db,"company","data",coll,k),data:{n,list:nl}}:{type:"del",ref:doc(db,"company","data",coll,k)});
  }
  return {ops,touched,added,updated,removed,big,oldTotal};
}
async function makePlan(kind,res){
  const cd=await getDoc(doc(db,"company","customers"));
  const exists=cd.exists(),old=exists?(cd.data().rows||[]):[];
  const crit=[],lines=[];let ops=[],drop=null;
  if(kind==="balances"){
    const om=new Map(old.map(r=>[r.k,r])),nk=new Set(res.items.map(i=>i.k));
    if(old.length>=10&&res.items.length<old.length*0.5)crit.push(`الملف فيه ${res.items.length} عميل بس والمحفوظ ${old.length}. ممكن الملف ناقص`);
    const rows=res.items.map(i=>{const o=om.get(i.k)||{};return {k:i.k,n:i.n,ph:i.ph,mb:i.mb,bal:i.bal,li:o.li||"",lt:o.lt??null,lp:o.lp??null,lr:o.lr??null}});
    const gone=old.filter(o=>!nk.has(o.k));
    lines.push(`عملاء في الملف: ${res.items.length}`,`عملاء جدد: ${res.items.filter(i=>!om.has(i.k)).length}`,`أرصدة اتغيّرت: ${res.items.filter(i=>om.has(i.k)&&om.get(i.k).bal!==i.bal).length}`,`عملاء هيتشالوا من القايمة بس وتاريخهم هيفضل محفوظ (مش في الملف): ${gone.length}${gone.length?` (مثال: ${gone.slice(0,3).map(g=>g.n).join("، ")})`:""}`);
    if(old.length)ops.push({type:"set",ref:doc(db,"admin","backup_customers"),data:{rows:old,at:Date.now()}});
    ops.push({type:"set",ref:doc(db,"company","customers"),data:{rows}});
  }else{
    if(!exists)crit.push("ارفع ملف المديونيات الأول");
    const p=await planDetail(kind,res);
    if(p.big.length)crit.push(`عميل واحد أو أكتر عنده بيانات كتير زيادة عن الحد (مثال: ${p.big.slice(0,3).join("، ")}). ارفع فترة أقصر`);
    lines.push(`الملف هيحل محل كل المحفوظ في التطبيق (التطبيق = نفس الملف بالظبط). فترة الملف: ${fd(res.range.min)} إلى ${fd(res.range.max)}`,`جديد: ${p.added}`);
    if(p.oldTotal>20&&p.removed>p.oldTotal*0.5)drop={r:p.removed,t:p.oldTotal};
    if(kind==="sales")lines.push(`معدّل: ${p.updated}`);
    lines.push(`هيتشال من التطبيق (مش في الملف): ${p.removed} من ${p.oldTotal} محفوظ`);
    ops=p.ops;
    const known=new Set(old.map(r=>r.k)),unk=[...new Set(res.items.filter(i=>!known.has(i.k)).map(i=>i.n))];
    if(unk.length)lines.push(`تنبيه: ${unk.length} عميل مش موجودين في المديونيات (مثال: ${unk.slice(0,3).join("، ")})`);
    if(kind==="sales"&&exists&&p.touched.length){
      const rm=new Map(old.map(r=>[r.k,{...r}])),rows=[...rm.values()];
      for(const t of p.touched){
        let r=rm.get(t.k);
        if(!r){r={k:t.k,n:t.n,ph:"",mb:"",bal:null,li:"",lt:null,lp:null,lr:null};rm.set(t.k,r);rows.push(r)}
        const top=t.list[0];r.li=top?top.d:"";r.lt=top?top.t:null;r.lp=top?top.p:null;r.lr=top?top.r:null;
      }
      ops.push({type:"set",ref:doc(db,"company","customers"),data:{rows}});
    }
  }
  return {crit,lines,ops,drop};
}
async function runBatches(ops){
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    ops.slice(i,i+400).forEach(o=>o.type==="del"?b.delete(o.ref):b.set(o.ref,o.data));
    await b.commit();
  }
}
async function commit(kind,res,fileName){
  if(res.critical.length)throw new Error(res.critical.join("؛ "));
  const plan=await makePlan(kind,res);
  if(plan.crit.length)throw new Error(plan.crit.join("؛ "));
  if(plan.drop&&!confirm(`الملف ده هيمسح ${plan.drop.r} من ${plan.drop.t} سجل محفوظ في التطبيق. متأكد إن الملف كامل؟`))throw new Error("اتلغى الاستيراد، مفيش حاجة اتغيّرت");
  await runBatches(plan.ops);
  await setDoc(doc(db,"company","meta"),{[kind]:{at:Date.now(),file:fileName}},{merge:true});
  await addDoc(collection(db,"admin","data","imports"),{at:Date.now(),by:st.user.uid,kind,file:fileName,rows:res.items.length,range:res.range?`${res.range.min}..${res.range.max}`:"",lines:plan.lines,warnings:res.warnings});
  return plan;
}

const st={user:null,rows:null,rep:null,led:undefined,al:{tab:"all",days:30},asort:"desc",meta:{},q:"",sort:"name",debtOnly:false,tab:"list",logs:null,me:null,pending:0,signingUp:false,unsub:null};

const isAdmin=()=>!!st.user&&(st.user.uid===ADMIN_UID||(!!st.me&&st.me.role==="admin"&&st.me.status==="approved"));
const authMsg=c=>({"auth/invalid-credential":"البريد أو كلمة السر غير صحيحة","auth/invalid-email":"البريد الإلكتروني غير صحيح","auth/user-disabled":"الحساب ده موقوف","auth/too-many-requests":"محاولات كتير، جرّب بعد شوية","auth/network-request-failed":"مفيش اتصال بالإنترنت","auth/email-already-in-use":"البريد ده مسجّل قبل كده، جرّب تسجّل دخول","auth/weak-password":"كلمة السر ضعيفة (6 حروف على الأقل)","auth/admin-restricted-operation":"التسجيل الجديد مقفول حالياً","auth/operation-not-allowed":"التسجيل الجديد مقفول حالياً"}[c]||"تعذّر تسجيل الدخول");

onAuthStateChanged(auth,async u=>{
  st.user=u;
  if(st.unsub){st.unsub();st.unsub=null}
  st.pending=0;st.me=null;
  if(!u){if(!st.signingUp)showLogin();return}
  if(st.signingUp)return;

});
async function boot(){
  drawShell('<div class="empty">جاري التحميل…</div>');
  try{
    if(isAdmin()){watchPending();await loadData();show("home");return}
    const [me,ld]=await Promise.all([getDoc(doc(db,"users",st.user.uid)),loadData().then(()=>true,()=>false)]);
    if(me.exists())st.me=me.data();
    else{
      const rec={email:st.user.email||"",name:(st.user.email||"").split("@")[0].slice(0,80),phone:"",status:"pending",createdAt:Date.now()};
      await setDoc(doc(db,"users",st.user.uid),rec);st.me=rec;
    }
    if(st.me.status!=="approved"){showGate();return}
    setDoc(doc(db,"users",st.user.uid),{lastSeen:Date.now(),visits:(st.me.visits||0)+1},{merge:true}).catch(()=>{});
    if(!ld)await loadData();
    if(isAdmin())watchPending();
    show("home");
  }catch(e){drawShell(errBox(e))}
}
async function loadData(){
  const [c,m,rp]=await Promise.all([getDoc(doc(db,"company","customers")),getDoc(doc(db,"company","meta")),getDoc(doc(db,"company","reports")).catch(()=>null)]);

}

  const s=st.me&&st.me.status;
  const msg=s==="rejected"?"تم رفض طلب التسجيل. تواصل مع المدير.":s==="disabled"?"تم إيقاف حسابك. تواصل مع المدير.":"طلبك وصل وبانتظار موافقة المدير. التطبيق هيتفتح أول ما يوافق.";

}
function showLogin(mode="in"){
  const up=mode==="up";
  app.innerHTML=`<div class="login"><img class="logo" src="${LOGO}" alt="شعار الحاج سلامة للمجمدات"><form id="lf">${up?'<label for="nm">الاسم</label><input id="nm" autocomplete="name" required maxlength="80"><label for="ph">رقم الموبايل</label><input id="ph" type="tel" dir="ltr" autocomplete="tel" maxlength="20">':""}<label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username" required><label for="pw">كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="${up?"new-password":"current-password"}" required minlength="6"><div id="le" class="err" hidden></div><button id="lb" class="btn" type="submit">${up?"إرسال طلب التسجيل":"دخول"}</button></form><button class="btn alt" id="sw" type="button">${up?"عندي حساب، دخول":"طلب حساب جديد"}</button></div>`;
  $("#sw").onclick=()=>showLogin(up?"in":"up");

    e.preventDefault();const b=$("#lb"),le=$("#le");b.disabled=true;le.hidden=true;

      try{await signInWithEmailAndPassword(auth,email,pw)}

    if(name.length<2){le.textContent="اكتب الاسم";le.hidden=false;b.disabled=false;return}
    st.signingUp=true;

      const cr=await createUserWithEmailAndPassword(auth,email,pw);
      await setDoc(doc(db,"users",cr.user.uid),{email:cr.user.email,name:name.slice(0,80),phone:phone.slice(0,20),status:"pending",createdAt:Date.now()});

      const l=$("#le");l.textContent=err.code?authMsg(err.code):"تعذّر إرسال الطلب، جرّب تاني";l.hidden=false;
    }

function updBanner(){

function stmtCalc(bal,inv,pay,from,to){
  const mv=[];
  inv.forEach(r=>mv.push({d:r.d,o:0,no:r.no,l:"فاتورة بيع رقم "+r.no,dr:r.t,cr:0}));
  pay.forEach(r=>mv.push({d:r.d,o:1,no:"",l:"تحصيل"+(r.x?" - "+r.x:""),dr:0,cr:r.a}));
  mv.sort((a,b)=>a.d.localeCompare(b.d)||a.o-b.o||((parseFloat(a.no)-parseFloat(b.no))||0));
  const net=a=>a.reduce((s,m)=>s+m.dr-m.cr,0);
  const open=r2(bal-net(mv.filter(m=>m.d>=from)));
  let run=open;
  const rows=mv.filter(m=>m.d>=from&&m.d<=to).map(m=>{run=r2(run+m.dr-m.cr);return {...m,bal:run}});
  return {open,rows,close:run,dr:r2(rows.reduce((s,m)=>s+m.dr,0)),cr:r2(rows.reduce((s,m)=>s+m.cr,0))};
}
function daySum(c,inv,pay,i){
  const d=inv[i].d;if(i&&inv[i-1].d===d)return"";
  if(c.bal==null||!/^\d{4}-\d{2}-\d{2}$/.test(d||""))return"";
  const R=stmtCalc(c.bal,inv,pay,d,d);
  return `<div class="panel" style="margin:12px 0 4px"><b>ملخص حساب العميل يوم ${fd(d)}</b><div class="mut" style="line-height:1.9">رصيد أول اليوم: <b>${fm(R.open)}</b><br>مشتريات اليوم: <b>${fm(R.dr)}</b><br>مدفوعات اليوم: <b>${fm(R.cr)}</b><br>مرتجعات اليوم: غير محسوبة لسه<br>رصيد آخر اليوم: <b>${fm(R.close)}</b></div></div>`;
}

const dn=s=>{const [y,m,d]=String(s).split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const dIso=n=>new Date(n*864e5).toISOString().slice(0,10);
const isD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
function mkLedger(invs,pays){
  const ck=[],cn=[],ix=new Map(),sn=[],sx=new Map(),iv=[],pv=[];
  const ci=(k,n)=>{let i=ix.get(k);if(i===undefined){i=ck.length;ix.set(k,i);ck.push(k);cn.push(n||"")}return i};
  for(const d of invs)for(const i of d.list||[]){if(!isD(i.d))continue;const nm=i.s||"بدون اسم";let s=sx.get(nm);if(s===undefined){s=sn.length;sx.set(nm,s);sn.push(nm)}iv.push(ci(d.k,d.n),dn(i.d),i.t||0,s)}
  for(const d of pays)for(const p of d.list||[]){if(!isD(p.d))continue;pv.push(ci(d.k,d.n),dn(p.d),p.a||0)}
  const at=Date.now();
  return {inv:{at,ck,cn,sn,v:iv},pay:{at,ck,cn,v:pv}};
}
function repTables(tab,a,b,L,rows){
  const I=L.inv,iv=I.v,pv=L.pay.v,A=dn(a),B=dn(b);
  const pick=(v,w)=>{const o=[];for(let i=0;i<v.length;i+=w)if(v[i+1]>=A&&v[i+1]<=B)o.push(i);return o};
  const ii=pick(iv,4),pi=pick(pv,3);
  const S=r2(ii.reduce((s,i)=>s+iv[i+2],0)),C=r2(pi.reduce((s,i)=>s+pv[i+2],0));
  const grp=(idx,v,key)=>{const m=new Map();for(const i of idx){const k=key(v,i),e=m.get(k)||[0,0];e[0]++;e[1]+=v[i+2];m.set(k,e)}return m};
  const cust=(idx,v)=>[...grp(idx,v,(v,i)=>v[i])].map(([ci,e])=>({k:I.ck[ci],c:[I.cn[ci],e[0],r2(e[1])]}));
  const days=(idx,v)=>[...grp(idx,v,(v,i)=>v[i+1])].map(([d,e])=>({o:d,c:[fd(dIso(d)),e[0],r2(e[1])]}));
  const mons=(idx,v)=>[...grp(idx,v,(v,i)=>dIso(v[i+1]).slice(0,7))].map(([m,e])=>({o:+m.replace("-",""),c:[m,e[0],r2(e[1])]}));
  const act=rows.filter(r=>!r.st),dbt=r2(act.reduce((s,r)=>s+(r.bal>0?r.bal:0),0));
  const stop=act.filter(r=>isD(r.li)&&daysSince(r.li)>=30);
  const nI=ii.length;
  if(tab==="gen")return {cards:[["إجمالي المبيعات",fm(S)],["إجمالي التحصيلات",fm(C),"ok"],["عدد الفواتير",nI],["إجمالي المديونيات الحالية",fm(dbt),"debt"],["عدد العملاء",act.length],["نشطين (آخر 30 يوم)",act.filter(r=>isD(r.li)&&daysSince(r.li)<30).length],["غير نشطين (30 يوم+)",stop.length]],
    tables:[{title:"مقارنة المبيعات والتحصيلات",head:["البند","المبلغ"],data:[{c:["المبيعات",S]},{c:["التحصيلات",C]},{c:["الفرق (مبيعات - تحصيلات)",r2(S-C)]}],sort:1,noTot:1,keep:1}]};
  if(tab==="sales")return {cards:[["إجمالي المبيعات",fm(S)],["عدد الفواتير",nI],["متوسط الفاتورة",nI?fm(S/nI):"—"]],tables:[
    {title:"المبيعات اليومية",head:["اليوم","الفواتير","المبيعات"],data:days(ii,iv),byO:1},
    {title:"المبيعات الشهرية",head:["الشهر","الفواتير","المبيعات"],data:mons(ii,iv),byO:1},
    {title:"أكثر العملاء شراءً",head:["العميل","الفواتير","المشتريات"],data:cust(ii,iv)}]};
  if(tab==="coll")return {cards:[["إجمالي التحصيلات",fm(C),"ok"],["عدد الدفعات",pi.length]],tables:[
    {title:"التحصيلات اليومية",head:["اليوم","الدفعات","المبلغ"],data:days(pi,pv),byO:1},
    {title:"التحصيل حسب العميل (الأكثر سداداً)",head:["العميل","الدفعات","المبلغ"],data:cust(pi,pv)}]};
  if(tab==="sell"){
    const m=new Map();for(const i of ii){const s=iv[i+3],e=m.get(s)||[0,0];e[0]++;e[1]+=iv[i+2];m.set(s,e)}
    return {cards:[["عدد البائعين",m.size],["إجمالي المبيعات",fm(S)]],tables:[{title:"أداء البائعين",head:["البائع","الفواتير","المبيعات","متوسط الفاتورة"],data:[...m].map(([s,e])=>({c:[I.sn[s],e[0],r2(e[1]),r2(e[1]/e[0])]})),sort:2}]};
  }
  if(tab==="cust"){
    const len=B-A+1,pm=new Map(),cm=new Map();
    for(let i=0;i<iv.length;i+=4){const d=iv[i+1];if(d>=A-len&&d<A)pm.set(iv[i],(pm.get(iv[i])||0)+iv[i+2]);else if(d>=A&&d<=B)cm.set(iv[i],(cm.get(iv[i])||0)+iv[i+2])}
    const drop=[];for(const [ci,p] of pm){const c=cm.get(ci)||0;if(c<p)drop.push({k:I.ck[ci],c:[I.cn[ci],r2(p),r2(c),r2(p-c)]})}
    return {cards:[["عملاء اشتروا في الفترة",new Set(ii.map(i=>iv[i])).size],["عملاء انخفضت مشترياتهم",drop.length,"debt"]],tables:[
      {title:"أعلى العملاء شراءً",head:["العميل","الفواتير","المشتريات"],data:cust(ii,iv)},
      {title:"العملاء الأعلى مديونية (الرصيد الحالي)",head:["العميل","الرصيد"],data:act.filter(r=>r.bal>0).map(r=>({k:r.k,c:[r.n,r.bal]})),sort:1,keep:1},
      {title:"العملاء غير النشطين (30 يوم+ بدون شراء)",head:["العميل","أيام بدون شراء","الرصيد"],data:stop.map(r=>({k:r.k,c:[r.n,daysSince(r.li),r.bal??0]})),sort:1,noTot:1,keep:1},
      {title:"انخفضت مشترياتهم عن الفترة السابقة (بنفس الطول)",head:["العميل","الفترة السابقة","الفترة الحالية","الانخفاض"],data:drop,sort:3}]};
  }
  return {cards:[],tables:[]};
}

    s.forEach(d=>u.push({id:d.id,...d.data()}));
    u.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const by=x=>u.filter(r=>r.status===x),card=(r,btns)=>`<div class="item"><span>${esc(r.name)}${r.role==="admin"?' <span class="badge">مدير</span>':""}<br><span class="mut" dir="ltr">${esc(r.email)}${r.phone?" · "+esc(r.phone):""}</span>${r.status==="approved"?`<br><span class="mut">آخر استخدام: ${r.lastSeen?new Date(r.lastSeen).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"}):"لم يدخل بعد"} · عدد مرات الفتح: ${r.visits||0}</span>`:""}</span><span>${btns}</span></div>`;
    const bt=(id,s2,l,alt)=>`<button class="btn sm${alt?" alt":""}" data-act="ustat" data-uid="${esc(id)}" data-s="${s2}">${l}</button>`;
    const roleBtn=r=>isRoot()?`<button class="btn sm alt" data-act="urole" data-uid="${esc(r.id)}" data-r="${r.role==="admin"?"user":"admin"}">${r.role==="admin"?"إلغاء المدير":"ترقية لمدير"}</button>`:"";
    const dl=id=>`<button class="btn sm alt del" data-act="udel" data-uid="${esc(id)}">حذف</button>`;
    const sec=(t,arr,f)=>`<h2 class="sec">${t} (${arr.length})</h2>${arr.length?`<div>${arr.map(f).join("")}</div>`:'<div class="mut">لا يوجد</div>'}`;
    box.className="";
    box.innerHTML=sec("طلبات جديدة",by("pending"),r=>card(r,bt(r.id,"approved","اعتماد")+" "+bt(r.id,"rejected","رفض",1)))+sec("بائعين معتمدين",by("approved"),r=>card(r,(r.role==="admin"&&!isRoot()?"":bt(r.id,"disabled","إيقاف",1)+" "+dl(r.id))+" "+roleBtn(r)))+sec("موقوفين أو مرفوضين",[...by("disabled"),...by("rejected")],r=>card(r,bt(r.id,"approved","إعادة تفعيل")+" "+dl(r.id)));
  }catch(e){box.className="";box.innerHTML=errBox(e)}
}
async function setStatus(uid,s,btn){
  btn.disabled=true;
  try{await setDoc(doc(db,"users",uid),{status:s,decidedAt:Date.now()},{merge:true})}catch(e){btn.disabled=false;alert("تعذّر التنفيذ");return}
  usersInit();
}

async function setRole(uid,role,btn){
  if(!confirm(role==="admin"?"تخلّي البائع ده مدير؟ هيقدر يرفع الملفات ويدير المستخدمين.":"تشيل صلاحية المدير من المستخدم ده؟"))return;
  btn.disabled=true;
  try{await setDoc(doc(db,"users",uid),{role},{merge:true})}catch(e){btn.disabled=false;alert("تعذّر التنفيذ. اتأكد إن قواعد Firestore الجديدة اتنشرت");return}
  usersInit();
}
async function delUser(uid,btn){
  if(!confirm("تحذف البائع ده من التطبيق؟"))return;
  btn.disabled=true;
  try{await deleteDoc(doc(db,"users",uid))}catch(e){btn.disabled=false;alert("تعذّر الحذف");return}
  usersInit();
}

/* ---------- الأحداث ---------- */
app.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-k],[data-tab],[data-sort],[data-asort],[data-rp],[data-al]");if(!t)return;
  if(t.dataset.rp)return rpClick(t.dataset.rp);
  if(t.dataset.al)return alClick(t.dataset.al);
  if(t.dataset.asort){const y=scrollY;st.asort=t.dataset.asort;alShow();return scrollTo(0,y)}
  if(t.dataset.tab)return show(t.dataset.tab);
  if(t.dataset.k)return openCustomer(t.dataset.k);
  if(t.dataset.sort){
    if(t.dataset.sort==="debt")st.debtOnly=!st.debtOnly;else st.sort=t.dataset.sort;
    return drawList();
  }
  const a=t.dataset.act;
  if(a==="logout")return signOut(auth);
  if(a==="back")return show(st.tab);
  if(a==="reload"){t.disabled=true;st.led=undefined;try{await loadData()}catch(err){}show(st.tab);return}
  if(a==="apply")return onApply(t.dataset.kind,t);
  if(a==="ustat")return setStatus(t.dataset.uid,t.dataset.s,t);
  if(a==="udel")return delUser(t.dataset.uid,t);
  if(a==="urole")return setRole(t.dataset.uid,t.dataset.r,t);
  if(a==="rebuild")return rebuild(t);
  if(a==="xrep")return xrep(t);
  if(a==="xalert")return xalert(t);
  if(a==="recheck")return boot();
});
app.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;drawList()}});
app.addEventListener("change",e=>{const i=e.target;if(i.type==="file"&&i.files[0])onFile(i.dataset.kind,i.files[0])});
</script>
